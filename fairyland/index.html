<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ten Japanese folktales on a map of Japan, told as short ten-page stories for young children.">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Fairyland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Fredoka:wght@600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF; --panel:#F4F3F1; --ink:#161616; --soft:#4A4845; --mute:#8C8A86; --line:#E3E1DD;
  --land:#ECEBE8; --blue:#2F5BEA;
  --sans:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;padding-inline:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-block:40px 64px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,.pin:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.eyebrow,.cap,.count,.textbtn,.label .meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.eyebrow{color:var(--mute);margin:0 0 10px}

/* ---------- map view ---------- */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px 40px;margin-bottom:28px}
.top h1{font-weight:500;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.01em;margin:0}
.lede{margin:0;color:var(--mute);max-width:38ch;line-height:1.5}
.gallery{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:32px;align-items:end}
.mapfig{margin:0}
#map{display:block;width:100%;height:auto}
.land{fill:var(--land)}
.leader{stroke:#CFCCC6;stroke-width:1;fill:none}
.pin{cursor:pointer}
.pin .dot{fill:var(--ink);stroke:#fff;stroke-width:2}
.pin .t{font:500 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;fill:var(--ink)}
.pin .n{font:500 11px var(--sans);fill:var(--mute)}
.pin .hit{fill:transparent}
.pin:hover .dot,.pin:focus .dot,.pin.on .dot{fill:var(--blue)}
.pin:hover .t,.pin:focus .t,.pin.on .t{fill:var(--blue)}
.everywhere-t{font:500 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;fill:var(--mute)}
.label{border:1px solid var(--line);padding:16px 18px;background:#fff;line-height:1.45}
.label b{display:block;font-weight:600;font-size:14px}
.label .jp{color:var(--soft);font-size:13px}
.label .meta{color:var(--mute);margin-top:10px}
.label .go{display:inline-block;margin-top:14px;font-size:13px;font-weight:500;color:var(--ink);border-bottom:1px solid var(--ink)}
.label .go:hover{color:var(--blue);border-color:var(--blue)}

.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 20px;margin-top:56px;padding-top:40px;border-top:1px solid var(--line)}
.sw{display:flex;gap:10px;align-items:baseline;text-align:left}
.sw .st{width:7px;height:7px;border-radius:50%;border:1px solid var(--ink);flex:none;transform:translateY(-1px)}
.sw.ready .st{background:var(--ink)}
.sw:hover .cap{color:var(--blue)}
.cap{color:var(--ink);line-height:1.5}
.cap span{display:block;color:var(--mute)}
.static .sw .st{display:none}
.legend{margin-top:32px;color:var(--mute);font-size:12px;display:flex;align-items:center;gap:10px}
.legend i{width:7px;height:7px;border-radius:50%;background:var(--ink);display:inline-block}

/* ---------- story view ---------- */
.bar{display:flex;align-items:center;gap:20px;margin-bottom:28px}
.textbtn{color:var(--ink);border-bottom:1px solid transparent;padding-bottom:2px}
.textbtn:hover{border-color:var(--ink)}
.count{margin-left:auto;color:var(--mute);font-variant-numeric:tabular-nums}
.page{max-width:640px;margin:0 auto;min-height:340px;display:flex;flex-direction:column;justify-content:center;touch-action:pan-y}
.words{display:flex;flex-direction:column;gap:22px}
.words .label{align-self:flex-start;min-width:200px}
.words h3{font-weight:500;font-size:clamp(28px,3.4vw,40px);line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.words p{margin:0;font-size:clamp(20px,2.2vw,26px);line-height:1.6;color:var(--soft);max-width:34ch}
.words .moral{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);max-width:none}
.status{display:flex;align-items:center;gap:12px;font-size:15px!important;color:var(--ink)!important}
.small{font-size:14px!important;color:var(--mute)!important}
.spin{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--ink);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:22px;flex-wrap:wrap}
.fadein{animation:fade .4s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.nav{display:flex;align-items:center;gap:18px;margin:48px auto 0;max-width:640px}
.navbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-size:17px;display:grid;place-items:center;transition:border-color .15s}
.navbtn:hover:not(:disabled){border-color:var(--ink)}
.navbtn:disabled{opacity:.3;cursor:default}
.ticks{display:flex;gap:6px;flex:1;max-width:420px}
.ticks button{flex:1;height:2px;background:var(--line);position:relative}
.ticks button::after{content:"";position:absolute;inset:-10px 0}
.ticks button[aria-current="true"],.ticks button.past{background:var(--ink)}
.cast{margin-top:64px;background:var(--panel);padding:20px;display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:center}
.cast button{position:relative;font-size:13px;color:var(--soft);padding:4px 0}
.cast button:hover{color:var(--ink)}
.cast button[aria-current="true"]{color:var(--ink)}
.cast button[aria-current="true"]::after{content:"";position:absolute;top:50%;margin-top:-4px;right:-14px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.x{width:10px;height:10px;border-radius:50%;background:var(--blue)}
@media (max-width:820px){
  .swatches{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gallery{grid-template-columns:1fr}
  .page{grid-template-columns:1fr}
  .cast{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){.fadein,.spin{animation:none}}
</style>

<main class="wrap">
  <section id="mapView">
    <header class="top">
      <div>
        <p class="eyebrow">Japanese folktales · 昔話</p>
        <h1>Fairyland</h1>
      </div>
      <p class="lede">Ten old tales, placed where they are told. Choose one to read it as a short ten-page story.</p>
    </header>
    <div class="gallery">
      <figure class="mapfig"><svg id="map" viewBox="0 0 700 650" role="group" aria-label="Map of Japan with story pins"></svg></figure>
      <aside class="label" id="mapLabel" aria-live="polite"></aside>
    </div>
    <div class="swatches" id="shelf"></div>
    <p class="legend"><i></i>Filled dots are ready to read. The others are written the first time they are opened.</p>
  </section>

  <section id="storyView" hidden>
    <div class="bar">
      <button class="textbtn" id="backBtn">← Map</button>
      <span class="count" id="count"></span>
      <button class="textbtn" id="redo" hidden title="Write this story again">New version</button>
    </div>
    <div class="page" id="page">
      <div class="words" id="words"></div>
    </div>
    <div class="nav">
      <button class="navbtn" id="prev" aria-label="Previous page">←</button>
      <div class="ticks" id="dots"></div>
      <button class="navbtn" id="next" aria-label="Next page">→</button>
    </div>
    <div class="cast" id="cast"></div>
  </section>
</main>

<script>
/* =========================================================
   The ten stories: only the facts needed to write them.
   Pages are written by Claude the first time someone opens
   a story, then saved so everyone gets the same book.
   ========================================================= */
const STORIES=[
{id:'momotaro',n:1,title:'Momotarō',en:'The Peach Boy',jp:'桃太郎',place:'Okayama',ll:[133.93,34.66],lab:[130.4,36.0],
 guide:'A giant peach floats down the river to an old couple; a baby boy pops out. He grows strong and kind, takes kibi-dango dumplings, shares them with a dog, a monkey and a pheasant who join him, sails to Ogre Island, and the oni say sorry and return the treasure. Show no fighting or hurting: the oni give up because the team is brave.'},
{id:'urashima',n:2,title:'Urashima Tarō',en:'The Fisherman and the Turtle',jp:'浦島太郎',place:'Tango Peninsula, Kyoto',ll:[135.28,35.75],lab:[132.6,37.9],
 guide:'A kind fisherman saves a turtle from teasing children. The turtle carries him to the Dragon Palace under the sea where Princess Otohime welcomes him. He misses home; she gives him a box and tells him never to open it. Back home many years have passed; he opens it, white smoke puffs out and he becomes an old man with a white beard. Gentle, not scary.'},
{id:'kaguya',n:3,title:'Kaguya-hime',en:'The Moon Princess',jp:'かぐや姫',place:'Kōryō, Nara',ll:[135.98,34.45],lab:[137.9,32.9],
 guide:'A bamboo cutter finds a tiny girl inside a glowing bamboo stalk. She grows into the kind Shining Princess; gold appears in the bamboo. Princes want to marry her but cannot find the magic treasures she asks for. She is sad looking at the moon: she comes from the Moon and must go home. On the full moon a shining cloud takes her; her parents remember her whenever the moon shines.'},
{id:'issunboshi',n:4,title:'Issun-bōshi',en:'The One-Inch Boy',jp:'一寸法師',place:'Naniwa (Osaka)',ll:[135.36,34.7],lab:[134.3,31.95],
 guide:'An old couple wish for a child and get a boy as small as a finger. With a needle for a sword, a rice bowl for a boat and a chopstick for an oar he goes down the river to Kyoto, befriends a princess, is swallowed by an oni, pokes it from inside until it spits him out, and the oni drops a magic mallet that makes him grow tall.'},
{id:'kintaro',n:5,title:'Kintarō',en:'The Golden Boy',jp:'金太郎',place:'Mt. Ashigara, Kanagawa',ll:[139.15,35.18],lab:[141.4,34.0],
 guide:'A super-strong mountain boy in a red bib with a big axe. His friends are a bear, a monkey, a rabbit and a deer; they play sumo and he beats the bear. He pushes a tree across a river to make a bridge. A samurai sees how strong and kind he is and invites him to help protect people; he becomes a gentle samurai.'},
{id:'tsuru',n:6,title:'Tsuru no Ongaeshi',en:'The Crane’s Gift',jp:'鶴の恩返し',place:'Nanyō, Yamagata',ll:[140.15,38.05],lab:[135.0,40.9],
 guide:'A kind young man frees a crane from a trap in the snow. A young woman arrives on a snowy night and they become a family. She weaves beautiful cloth but asks him never to look while she works. He sells the cloth. She grows tired; he peeks and sees the crane weaving with her own feathers. Because he saw, she must fly away.'},
{id:'kachikachi',n:7,title:'Kachi-kachi Yama',en:'Crackling Mountain',jp:'かちかち山',place:'Lake Kawaguchi, Yamanashi',ll:[138.62,35.64],lab:[142.2,35.25],
 guide:'SOFTENED for age 5: a naughty tanuki steals an old couple’s vegetables and plays a mean trick that hurts Grandma (no detail). A clever rabbit teaches it a lesson: the tanuki carries firewood, the rabbit makes click-clack sparks ("Crackling Mountain"), the firewood gets hot and the tanuki runs with a sore back. Then the tanuki builds a mud boat that melts on the lake; the rabbit pulls him out, he says sorry and promises to be kind, and Grandma gets better. Nobody dies.'},
{id:'kasajizo',n:8,title:'Kasa Jizō',en:'The Straw Hats',jp:'笠地蔵',place:'all over Japan',wide:true,
 guide:'A poor old couple in the snowy mountains have no rice cakes for New Year. Grandpa makes straw hats to sell but nobody buys. On the way home he puts hats on six snowy Jizō statues, and gives the sixth his own towel because he is one hat short. They go to bed hungry but happy. At night the Jizō come stomping with a sled of gifts; they have the happiest New Year.'},
{id:'hanasaka',n:9,title:'Hanasaka Jiisan',en:'The Old Man Who Made Trees Bloom',jp:'花咲か爺さん',place:'all over Japan',wide:true,
 guide:'A kind old couple love their white dog Shiro. Shiro barks "dig here" and Grandpa finds gold; a greedy neighbor tries and finds only mud and rocks. Shiro grows old and dies peacefully (say it very gently, no cause); they plant a tree for him. Its wood makes a mochi bowl that turns rice to gold; the neighbor gets mud and burns the bowl. Grandpa scatters the ashes and bare trees bloom with pink flowers; a lord rewards him. The neighbor tries and the ashes blow in the lord’s face ("Achoo!").'},
{id:'suzume',n:10,title:'Shita-kiri Suzume',en:'The Sparrow’s Baskets',jp:'舌切り雀',place:'all over Japan',wide:true,
 guide:'SOFTENED for age 5 (no tongue cutting): a kind old man loves his pet sparrow; his grumpy wife shoos it away when it pecks her rice paste. He finds the sparrows’ house in the bamboo forest where they sing and dance for him. They offer a big or small basket; he picks the small one and finds treasure. Greedy Grandma grabs the big one and out pop silly spooky monsters and wiggly snakes. She learns not to be greedy.'}
];

function cleanBook(raw){
  const arr=Array.isArray(raw)?raw:(raw&&Array.isArray(raw.slides)?raw.slides:null);
  if(!arr||arr.length<6)throw {code:'bad_book'};
  const str=(v,n)=>typeof v==='string'?v.slice(0,n):'';
  return arr.slice(0,12).map((s,i)=>({cover:i===0,h:str(s.h,80),p:str(s.p,400),moral:str(s.moral,90)}));
}
function prompt(st){return `Write the Japanese folktale "${st.title}" (${st.en}) as a 10-page read-aloud story for a 5-year-old.

THE STORY: ${st.guide}

RULES
- Exactly 10 pages. Page 1 is the opening: "h" is the title, "p" is one or two inviting sentences that set the scene.
- Pages 2-10 tell the story in order. Each has "h" (a short heading, 2-5 words) and "p" (2-3 short sentences, at most 45 words, simple words a 5-year-old knows; fun sounds and a little repetition are welcome).
- Page 10 ends happily or gently and adds "moral": one short lesson (at most 8 words).
- Warm and gentle: no blood, nothing frightening.

Reply with only JSON: {"slides":[{"h":"...","p":"..."}, ... ]}`;}
</script>

const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const map=document.getElementById('map');
function el(tag,attrs,parent=map){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
const pad=n=>String(n).padStart(2,'0');
function labelFor(s){
  $('mapLabel').innerHTML=`<b>${esc(s.title)}</b><span class="jp">${s.jp}</span><br>${esc(s.en)}<div class="meta">${pad(s.n)} · ${s.wide?'Told all over Japan':esc(s.place)}</div><button class="go" id="goBtn">Open story →</button>`;
  $('goBtn').onclick=()=>open(s.id);
  document.querySelectorAll('#map .pin').forEach(p=>p.classList.toggle('on',p.dataset.id===s.id));
}
function drawMap(){
  for(const k in islands) el('path',{class:'land',d:'M'+islands[k].map(p=>P(p).map(v=>v.toFixed(1)).join(',')).join('L')+'Z'});
  const pinned=STORIES.filter(s=>!s.wide);
  for(const s of pinned){const [x,y]=P(s.ll),[lx,ly]=P(s.lab);el('line',{class:'leader',x1:x,y1:y,x2:lx,y2:ly})}
  for(const s of pinned){
    const g=el('g',{class:'pin',tabindex:0,role:'link','data-id':s.id,'aria-label':`${s.title}, ${s.en}, from ${s.place}`});
    const [x,y]=P(s.ll),[lx,ly]=P(s.lab);
    el('rect',{class:'hit',x:lx-70,y:ly-16,width:140,height:26},g);
    el('text',{class:'n',x:lx,y:ly-4,'text-anchor':'middle'},g).textContent=pad(s.n);
    el('text',{class:'t',x:lx,y:ly+10,'text-anchor':'middle'},g).textContent=s.title;
    el('circle',{class:'dot',cx:x,cy:y,r:5.5},g);
    hook(g,s);
  }
  el('text',{class:'everywhere-t',x:24,y:36}).textContent='Told everywhere';
  STORIES.filter(s=>s.wide).forEach((s,i)=>{
    const y=62+i*26;
    const g=el('g',{class:'pin',tabindex:0,role:'link','data-id':s.id,'aria-label':`${s.title}, ${s.en}`});
    el('rect',{class:'hit',x:18,y:y-12,width:200,height:24},g);
    el('circle',{class:'dot',cx:30,cy:y,r:5.5},g);
    el('text',{class:'n',x:44,y:y+4},g).textContent=pad(s.n);
    el('text',{class:'t',x:66,y:y+4},g).textContent=s.title;
    hook(g,s);
  });
  labelFor(STORIES[0]);
}
function hook(g,s){
  g.addEventListener('click',()=>open(s.id));
  g.addEventListener('mouseenter',()=>labelFor(s));g.addEventListener('focus',()=>labelFor(s));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(s.id)}});
}
const shelfTags={};
function drawShelf(){
  const shelf=$('shelf');
  for(const s of STORIES){
    const b=document.createElement('button');b.className='sw';
    b.innerHTML=`<span class="st"></span><span class="cap">${pad(s.n)} · ${esc(s.title)}<span>${esc(s.en)}</span></span>`;
    b.setAttribute('aria-label',`${s.title}, ${s.en}`);
    shelfTags[s.id]=b;
    b.addEventListener('click',()=>open(s.id));
    b.addEventListener('mouseenter',()=>labelFor(s));
    shelf.appendChild(b);
  }
}
function markReady(){for(const s of STORIES)shelfTags[s.id].classList.toggle('ready',!!books[s.id])}
function drawCast(){
  const c=$('cast');c.innerHTML='';
  for(const s of STORIES){
    const b=document.createElement('button');
    b.textContent=s.title;
    b.setAttribute('aria-label',`Open ${s.title}`);
    if(cur===s)b.setAttribute('aria-current','true');
    b.onclick=()=>open(s.id);c.appendChild(b);
  }
}

/* ---------- the ten stories, written out ----------
   Used everywhere Claude isn't available (for example on a normal website).

const BUILTIN={
momotaro:[
 ['Momotarō','Long ago in Japan, a tiny boy came out of a giant peach. This is his story.'],
 ['A giant peach!','An old man and an old woman lived by a river. One day, a big, big peach came floating down the water. Bob, bob, bob!'],
 ['Pop! A baby!','They carried the peach home and opened it. Pop! Out came a little baby boy. They named him Momotarō, the Peach Boy.'],
 ['Big and strong','Momotarō ate his rice every day. He grew big and strong. Best of all, he was kind to everyone.'],
 ['Uh-oh, ogres!','Grumpy ogres called oni lived on an island far away. They took things that were not theirs. Momotarō said, “I will go and help!”'],
 ['Yummy dumplings','Grandma made him a bag of sweet dumplings called kibi-dango. “Be brave and be careful,” she said, and gave him a big hug.'],
 ['New friends','A dog, a monkey and a bird each asked, “May I have a dumpling?” Momotarō shared with them all. “We will come with you!” they said.'],
 ['Off they go!','They sailed across the sea together. The bird looked out from the sky, the monkey held the rope, and the dog was brave. What a team!'],
 ['“We are sorry!”','The ogres saw how brave and friendly the team was. They said, “We are sorry!” and gave back all the treasure.'],
 ['Home, happy home','Momotarō and his friends came home. Grandpa and Grandma hugged them tight, and everyone shared a big feast.','Be brave, be kind and share.']],
urashima:[
 ['Urashima Tarō','Long ago, a kind fisherman lived by the sea. One day, a little turtle changed his life.'],
 ['A kind fisherman','Urashima was a young fisherman. Every morning he went fishing, and every evening he came home to his mother.'],
 ['Please stop!','Some children were poking a little turtle on the beach. “Please stop!” said Urashima. He gently carried the turtle back to the sea.'],
 ['Hop on!','The next day, the turtle came back. “Thank you for helping me,” it said. “Hop on my back. I will show you something special.”'],
 ['Under the sea','Down, down, down they went. Fish swam by, and bubbles floated up. At the bottom stood the beautiful Dragon Palace.'],
 ['A wonderful party','Princess Otohime welcomed him. Fish danced, music played, and there was yummy food. Urashima had so much fun.'],
 ['Missing home','After a while, Urashima began to miss his mother. “I would like to go home now,” he told the princess.'],
 ['A special box','The princess gave him a pretty box tied with a red cord. “Take this with you,” she said, “but never, ever open it.”'],
 ['Puff!','At home, everything looked different. Many, many years had passed! Feeling lost, Urashima opened the box. Puff! White smoke came out.'],
 ['A long white beard','Urashima turned into an old man with a long white beard. He sat by the sea and smiled, remembering the Dragon Palace.','Some promises are important to keep.']],
kaguya:[
 ['Kaguya-hime','Long ago, a shining girl was found inside a bamboo stalk. This is the story of the Moon Princess.'],
 ['A glowing bamboo','An old man went into the forest to cut bamboo. One stalk was shining, like a little star inside it!'],
 ['A tiny girl','Inside was a tiny girl, as small as a thumb. The old man carried her home, and his wife was so happy.'],
 ['The Shining Princess','They named her Kaguya-hime, the Shining Princess. She grew up very fast, and she was kind and gentle.'],
 ['Gold in the bamboo','After that, the old man found gold inside the bamboo. Now the family had everything they needed.'],
 ['Too many princes','Five princes wanted to marry her. She asked each one to find a magic treasure. Nobody could find even one!'],
 ['Looking at the moon','Every night, Kaguya-hime looked up at the moon. She felt a little sad, and nobody knew why.'],
 ['A big secret','“I come from the Moon,” she told her parents. “Soon my Moon family will come to take me home.”'],
 ['Goodbye','On the night of the full moon, a shining cloud floated down. Kaguya-hime hugged her mother and father goodbye.'],
 ['Back to the Moon','She floated all the way up to the Moon. Whenever her parents saw it shine, they thought of her and smiled.','People we love stay in our hearts.']],
issunboshi:[
 ['Issun-bōshi','Long ago, there was a boy no bigger than your finger. But he had a very big heart.'],
 ['A wish','An old man and an old woman wished for a child. “Even a tiny one would make us happy,” they said.'],
 ['A tiny baby','Their wish came true! A baby boy was born, only as big as a finger. They called him Issun-bōshi, the One-Inch Boy.'],
 ['Ready to go','He wanted to see the big city. He took a needle for a sword, a rice bowl for a boat and a chopstick for an oar.'],
 ['Down the river','Row, row, row! He paddled his bowl boat all the way down the river to the city of Kyoto.'],
 ['A new friend','He went to work for a big family and became good friends with the princess. She loved his funny stories.'],
 ['Gulp!','One day, a big oni jumped out on the road! Gulp! It swallowed Issun-bōshi in one bite.'],
 ['Poke, poke, poke!','Inside the oni, he poked and poked with his needle. “Ouch! Ouch!” cried the oni. It spat him out and ran away.'],
 ['A magic mallet','The oni dropped a magic mallet. The princess shook it and said, “Grow, grow!”'],
 ['Tall and brave','Issun-bōshi grew taller and taller! He and the princess lived happily ever after.','Even small people can be very brave.']],

tsuru:[

};
const builtin=id=>BUILTIN[id].map(([h,p,moral],i)=>({cover:i===0,h,p,moral:moral||''}));
const LIVE=!!window.claude;

/* ---------- books: saved copies + writing new ones ---------- */
const books={};           // id -> slides, from the shared store
let db=null,sample=null;
const ready=(window.claude?Promise.all([
  claude.use('db').then(d=>{db=d;if(!d)return;
    d.collection('books').onSnapshot(snap=>{
      for(const doc of snap.docs){try{books[doc.id]=cleanBook(doc.data().slides)}catch(e){}}
      markReady();
    },()=>{});
  }).catch(()=>{}),
  claude.use('sample').then(sm=>{sample=sm}).catch(()=>{})
]):Promise.resolve());

/* ---------- reader ---------- */
let cur=null,idx=0,state='idle',slides=null,ctl=null;
function open(id){location.hash=id}
async function route(){
  const id=location.hash.slice(1);const s=STORIES.find(x=>x.id===id);
  ctl?.abort();
  if(!s){cur=null;$('storyView').hidden=true;$('mapView').hidden=false;return}
  cur=s;idx=0;slides=null;$('mapView').hidden=true;$('storyView').hidden=false;window.scrollTo(0,0);
  if(!books[s.id]){state='opening';render();await ready;if(cur!==s)return}
  if(books[s.id]){slides=books[s.id];state='reading';render();return}
  if(db){try{const d=await db.doc('books/'+s.id).get();if(cur!==s)return;if(d.exists){slides=books[s.id]=cleanBook(d.data().slides);state='reading';render();return}}catch(e){}}
  write(false);
}
async function write(fresh){
  const s=cur;
  if(!sample){slides=books[s.id]=builtin(s.id);idx=0;state='reading';render();return}
  state='writing';slides=null;render('Writing the story…');
  ctl=new AbortController();
  try{
    const out=await sample.json(prompt(s),{signal:ctl.signal,cache:fresh?false:{gcTime:86400000},onText:({text})=>{
      const n=(text.match(/"h"\s*:/g)||[]).length;
      if(n&&cur===s)$('status').textContent=`Writing page ${Math.min(n,10)} of 10…`;
    }});
    if(cur!==s)return;
    const book=cleanBook(out);
    books[s.id]=book;slides=book;idx=0;state='reading';render();
    if(db){try{await db.doc('books/'+s.id).set({slides:book,title:s.title,madeAt:new Date().toISOString()})}catch(e){}}
  }catch(e){
    if(cur!==s||e.code==='cancelled')return;
    if(!fresh&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)){slides=builtin(s.id);idx=0;state='reading';render();return}
    state='error';render(errText(e.code));
  }
}
function errText(c){
  if(c==='not_granted'||c==='sampling_disabled')return 'This story needs permission to use Claude before it can be written. You can allow it the next time you open a story.';
  if(c==='rate_limited')return 'Claude is busy right now. Wait a minute, then try again.';
  if(c==='session_expired')return 'Please sign in to Claude again, then try again.';
  return 'The pages didn’t come out right this time. Try again.';
}
function card(s,extra){return `<div class="label"><b>${esc(s.title)}</b><span class="jp">${s.jp}</span><br>${esc(s.en)}<div class="meta">${s.wide?'Told all over Japan':esc(s.place)}${extra?' · '+extra:''}</div></div>`}
function render(msg){
  const s=cur;
  drawCast();
  const nav=document.querySelector('.nav');
  if(state!=='reading'){
    $('count').textContent='';nav.hidden=true;$('redo').hidden=true;
    let w=card(s);
    if(state==='writing') w+=`<p class="status"><span class="spin"></span><span id="status">${esc(msg||'')}</span></p><p class="small">This story is being written for the first time. It takes about a minute, then it’s saved for next time.</p><div class="row"><button class="textbtn" id="stop">Stop</button></div>`;
    if(state==='error') w+=`<p>${esc(msg)}</p><div class="row"><button class="textbtn" id="retry">Try again</button><button class="textbtn" id="toMap">Back to the map</button></div>`;
    if(state==='opening') w+=`<p class="status"><span class="spin"></span><span>Opening the book…</span></p>`;
    if(state==='missing') w+=`<p>This book hasn’t been written yet, and Claude can’t be reached from here. Open this page in Claude to create it.</p><div class="row"><button class="textbtn" id="toMap">Back to the map</button></div>`;
    $('words').innerHTML=w;
    if($('stop'))$('stop').onclick=()=>{ctl?.abort();location.hash='map'};
    if($('retry'))$('retry').onclick=()=>write(true);
    if($('toMap'))$('toMap').onclick=()=>{location.hash='map'};
    return;
  }
  nav.hidden=false;$('redo').hidden=!sample;
  const sl=slides[idx],last=idx===slides.length-1;
  $('count').textContent=`${pad(idx+1)} / ${pad(slides.length)}`;
  let w='';
  if(sl.cover){w=card(s)+`<h3>${esc(sl.h||s.title)}</h3><p>${esc(sl.p||s.en)}</p>`}
  else{w=`<h3>${esc(sl.h)}</h3><p>${esc(sl.p)}</p>`+(sl.moral?`<p class="moral">${esc(sl.moral)}</p>`:'')}
  if(last){const nx=STORIES[(STORIES.indexOf(s)+1)%STORIES.length];w+=`<p class="moral" style="color:var(--mute)">The End</p><div class="row"><button class="textbtn" id="toMap">Back to the map</button><button class="textbtn" id="toNext">Next: ${esc(nx.title)} →</button></div>`}
  $('words').innerHTML=w;
  if(last){$('toMap').onclick=()=>{location.hash='map'};$('toNext').onclick=()=>open(STORIES[(STORIES.indexOf(s)+1)%STORIES.length].id)}
  const page=$('page');page.classList.remove('fadein');void page.offsetWidth;page.classList.add('fadein');
  $('prev').disabled=idx===0;$('next').disabled=last;
  const dots=$('dots');dots.innerHTML='';
  slides.forEach((_,i)=>{const d=document.createElement('button');d.setAttribute('aria-label',`Go to page ${i+1}`);if(i===idx)d.setAttribute('aria-current','true');else if(i<idx)d.className='past';d.onclick=()=>{idx=i;render()};dots.appendChild(d)});
}
function go(d){if(!cur||state!=='reading')return;const n=idx+d;if(n<0||n>=slides.length)return;idx=n;render()}
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('backBtn').onclick=()=>{location.hash='map'};
$('redo').onclick=()=>{$('redo').hidden=true;write(true)};
document.addEventListener('keydown',e=>{if(!cur)return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='Escape')location.hash='map'});
let sx=null;const pg=$('page');
pg.addEventListener('pointerdown',e=>{sx=e.clientX});
pg.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)go(dx<0?1:-1)});
window.addEventListener('hashchange',route);
if(!LIVE){for(const st of STORIES)books[st.id]=builtin(st.id);document.querySelector('.legend').hidden=true;document.body.classList.add('static')}
drawMap();drawShelf();markReady();
route();
</script>

</body>
</html>
