<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Origy: an interactive map of 28 Japanese traditions that came from China, showing where each began and when it reached Japan.">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Origy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
:root{
  --bg:#FFFFFF; --card:#F1F1F0; --land:#E0E0DE; --land-edge:#D2D2D0; --land-faint:#E9E9E8;
  --chip:#FFFFFF; --ink:#1B1B1B; --muted:#8C8C8A; --line:#E4E4E2;
  --accent:#C0392B; --shadow:rgba(0,0,0,.10);
  --sans:"DM Sans","PingFang SC","Hiragino Sans","Noto Sans CJK SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121212; --card:#1C1C1C; --land:#2C2C2B; --land-edge:#363635; --land-faint:#242424;
    --chip:#262626; --ink:#ECECEA; --muted:#8E8E8B; --line:#2E2E2D;
    --accent:#E0665A; --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121212; --card:#1C1C1C; --land:#2C2C2B; --land-edge:#363635; --land-faint:#242424;
  --chip:#262626; --ink:#ECECEA; --muted:#8E8E8B; --line:#2E2E2D;
  --accent:#E0665A; --shadow:rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:48px 56px}
.cap{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}

.stage{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"map label" "grid grid";gap:40px 48px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "grid" "label";gap:28px}}

/* the map "device" */
.device{grid-area:map;background:var(--card);border-radius:10px;box-shadow:0 18px 40px -18px var(--shadow),0 2px 6px var(--shadow);position:relative;overflow:hidden}
.device .brand{position:absolute;left:22px;top:18px;line-height:1.35;color:var(--ink);opacity:.75}
.device .note{position:absolute;right:20px;bottom:14px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
svg.map{display:block;width:100%;height:auto}
.land{fill:var(--land);stroke:none}
.land.faint{fill:var(--land-faint)}
.cname{font-family:var(--sans);font-size:12px;letter-spacing:.3em;fill:var(--muted);font-weight:600}
.inset{fill:none;stroke:var(--land-edge);stroke-dasharray:2 3}
.origin{fill:var(--muted);opacity:.35}
.origin.on{fill:var(--accent);opacity:1}
.jpdot{fill:var(--ink);opacity:.35}
.leader{stroke:var(--ink);stroke-opacity:.14;stroke-width:1}
.leader.on{stroke-opacity:.8}
.bub{cursor:pointer;outline:none}
.bub .face{fill:var(--chip);filter:drop-shadow(0 1.5px 2px var(--shadow))}
.bub .ring{fill:none;stroke:var(--ink);stroke-width:1.4;opacity:0}
.bub text{font-size:18px;text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none}
.bub:hover .ring,.bub:focus-visible .ring{opacity:.35}
.bub.on .ring{opacity:1}
.route{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.traveler{fill:var(--accent)}
.plabel{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.plabel.cn{fill:var(--accent)}

/* museum label */
.label{grid-area:label;border:1px solid var(--line);background:var(--bg);padding:20px 22px;max-width:560px;display:flex;flex-direction:column;gap:12px}
.label .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.label h2{font-size:17px;font-weight:600;margin:0;line-height:1.3}
.label .yr{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.label .names{color:var(--muted);font-size:13px;margin-top:2px}
.label .lede{margin:0;color:var(--ink)}
.route-line{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;font-size:13px}
.route-line dt{color:var(--muted);padding-top:2px}
.route-line dd{margin:0}
.route-line .cnp{color:var(--accent)}
.route-line small{color:var(--muted);font-size:12px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--ink);font-size:13px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" →";}
details[open] summary::after{content:" ↓"}
details p{margin:10px 0 0;color:var(--ink);max-width:62ch}
details p.jp{color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
.pager button{font:inherit;background:none;border:0;padding:4px 0;color:var(--muted);cursor:pointer}
.pager button:hover{color:var(--ink)}
.pager button:focus-visible,summary:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}

/* sliding strip */
.grid{grid-area:grid;min-width:0;display:flex;flex-direction:column;gap:14px}
.strip-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.strip-head h1{margin:0;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.arrows{display:flex;gap:8px}
.arrows button{font:inherit;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:15px;line-height:1}
.arrows button:hover{border-color:var(--ink)}
.arrows button:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
.scroller{position:relative;display:flex;gap:28px;overflow-x:auto;scroll-snap-type:x proximity;scroll-behavior:smooth;padding:4px 2px 10px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 40px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 40px),transparent 100%)}
.scroller::-webkit-scrollbar{display:none}
.era{display:flex;flex-direction:column;gap:14px;flex:none}
.era .cap{color:var(--muted);border-top:1px solid var(--line);padding-top:8px;display:flex;gap:10px;white-space:nowrap}
.era .cap span+span{font-weight:500;letter-spacing:.1em}
.sw{display:flex;gap:6px}
.s{font:inherit;background:none;border:0;padding:4px 0 0;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;width:84px;flex:none;scroll-snap-align:center}
.s .dot{width:48px;height:48px;border-radius:50%;background:var(--chip);box-shadow:0 1.5px 4px var(--shadow);display:grid;place-items:center;font-size:22px;outline:1.4px solid transparent;outline-offset:3px;transition:transform .15s}
.s:hover .dot{transform:translateY(-2px)}
.s.on .dot{outline-color:var(--ink)}
.s:focus-visible .dot{outline-color:var(--muted)}
.s .t{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;text-align:center;line-height:1.3}
.s .t span{display:block;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.foot{margin-top:40px;color:var(--muted);font-size:12px;max-width:80ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="device">
      <div class="brand cap">Origy<br>中国 → 日本</div>
      <svg class="map" id="map" role="img" aria-label="Map of China and Japan with clickable cultural items"></svg>
      <div class="note">Simplified shapes</div>
    </div>
    <article class="label" id="label" aria-live="polite"></article>
    <section class="grid">
      <div class="strip-head"><h1>28 things Japan got from China · slide →</h1>
        <div class="arrows"><button type="button" id="left" aria-label="Scroll left">←</button><button type="button" id="right" aria-label="Scroll right">→</button></div></div>
      <div class="scroller" id="grid"></div>
    </section>
  </div>
  <p class="foot">Early dates come from Japanese chronicles such as the Nihon Shoki and are traditional rather than exact. Several items came by way of Korea, and most were reshaped once they reached Japan.</p>
</div>

const ITEMS = [{"id":"kanji","emoji":"📜","en":"Kanji","ja":"漢字","zh":"汉字","era":"asuka","arrive":"c. 400s","jp":"asuka","cn":"anyang","via":"korea","cnWhen":"Shang dynasty, c. 1200 BCE","lede":"Japan had no writing system of its own. It borrowed China's.","story":["The oldest Chinese characters are carved on Shang dynasty oracle bones found at Anyang. Over two thousand years they became the script of every educated person in East Asia.","Japanese chronicles say a scholar named Wani (王仁) came from the Korean kingdom of Baekje carrying the Analects of Confucius. The earliest securely dated Japanese inscription, on the Inariyama sword, was written in Chinese characters in 471."],"twist":"In the 800s Japan simplified kanji into two phonetic scripts, hiragana and katakana, and still writes with all three today."},{"id":"confucius","emoji":"📖","en":"Confucianism","ja":"儒教","zh":"儒家","era":"asuka","arrive":"400s–604","jp":"asuka","cn":"qufu","via":"korea","cnWhen":"Confucius, 551–479 BCE","lede":"The ideas behind Japanese ideals of harmony, hierarchy and duty.","story":["Confucius taught in the state of Lu, at Qufu in today's Shandong. His ideas on family duty, ritual and good government became China's state philosophy under the Han.","The Confucian classics reached Japan through Baekje along with writing. In 604 Prince Shōtoku's Seventeen-Article Constitution opened with a line adapted from the Analects: \"Harmony is to be valued.\""],"twist":"Confucian values of loyalty and respect for elders shaped samurai ethics and are still felt in Japanese workplaces and schools."},{"id":"buddhism","emoji":"☸️","en":"Buddhism","ja":"仏教","zh":"佛教","era":"asuka","arrive":"538 or 552","jp":"asuka","cn":"luoyang","via":"korea","cnWhen":"Reached China c. 1st century CE","lede":"Born in India, translated in China, sent to Japan by a Korean king.","story":["Buddhism came to China from India along the Silk Road. Tradition says China's first Buddhist temple, the White Horse Temple, was built at Luoyang in 68 CE. Chinese monks then spent centuries translating the sutras.","In 538 (some records say 552), King Seong of Baekje sent a gilt-bronze Buddha and Chinese sutras to the Japanese court. The Soga clan championed the new faith and built Asuka-dera, Japan's first full temple, in 588–596."],"twist":"Japan still reads the sutras in their Chinese translations, pronounced the Japanese way."},{"id":"calendar","emoji":"📅","en":"Calendar & zodiac","ja":"暦・干支","zh":"历法・生肖","era":"asuka","arrive":"602","jp":"asuka","cn":"luoyang","via":"korea","cnWhen":"Refined over the Han dynasty, 206 BCE–220 CE","lede":"Why Japanese New Year cards still feature the animal of the year.","story":["China's lunisolar calendar and its cycle of twelve animals and ten heavenly stems were in place by the Han dynasty.","In 602 a Baekje monk named Gwalleuk (観勒) brought books on calendar-making, astronomy and divination to Japan. The court began keeping time by the Chinese calendar soon after."],"twist":"Japan switched to the Western calendar in 1873 and moved New Year to January 1, but kept the zodiac animals for nengajō New Year cards."},{"id":"chopsticks","emoji":"🥢","en":"Chopsticks","ja":"箸","zh":"筷子","era":"asuka","arrive":"Early 600s","jp":"asuka","cn":"anyang","via":null,"cnWhen":"Bronze chopsticks from c. 1200 BCE","lede":"Japan adopted Chinese table manners along with Chinese statecraft.","story":["Bronze chopsticks have been excavated at the Shang capital near Anyang. They were first used for cooking, and became everyday eating tools in China by the Han dynasty.","Tradition says that after Ono no Imoko's embassy to Sui China in 607, Prince Shōtoku had the court adopt Chinese-style dining with chopsticks."],"twist":"Japanese chopsticks became shorter and pointed, suited to picking fish off the bone, and Japan made them personal: each family member has their own pair."},{"id":"obon","emoji":"🏮","en":"Obon","ja":"お盆","zh":"盂兰盆节","era":"asuka","arrive":"606","jp":"asuka","cn":"nanjing","via":null,"cnWhen":"Liang dynasty, 538","lede":"Japan's summer festival of the dead began as a Chinese Buddhist rite.","story":["The Yulanpen (盂兰盆) festival comes from the story of the monk Mulian, who rescued his mother from hunger in the afterlife. Emperor Wu of Liang held a grand Yulanpen ceremony at his capital Jiankang (Nanjing) in 538. It merged with China's Ghost Festival.","The Nihon Shoki records Japan's first Obon ceremony at the court of Empress Suiko in 606."],"twist":"Japan made Obon a national homecoming holiday in August, with bon-odori dances and lanterns floated on rivers to guide spirits home."},{"id":"pagoda","emoji":"🛕","en":"Pagodas & temple architecture","ja":"五重塔","zh":"佛塔","era":"asuka","arrive":"588–600s","jp":"ikaruga","cn":"luoyang","via":"korea","cnWhen":"Northern Wei, Yongning Pagoda 516","lede":"Japan's oldest wooden buildings follow Chinese plans, built by Korean carpenters.","story":["China turned the Indian stupa into a tall, multi-story wooden tower. The greatest was the Yongning Pagoda in Luoyang, completed in 516 and said to be visible from 50 km away.","Builders, tile makers and carpenters from Baekje built Japan's first temples. The five-story pagoda at Hōryū-ji in Ikaruga, built in the late 600s from wood felled around 594, is among the oldest wooden buildings in the world."],"twist":"Japanese pagodas were refined to survive earthquakes, with a central pillar that lets each floor sway independently."},{"id":"kimono","emoji":"👘","en":"Kimono","ja":"着物","zh":"唐装 (Tang robes)","era":"nara","arrive":"701–719","jp":"nara","cn":"changan","via":null,"cnWhen":"Tang dynasty, 618–907","lede":"The kimono's ancestor is the Tang court robe.","story":["Tang court dress in Chang'an featured wrapped, cross-collared robes with wide sleeves and a sash. Rank was shown by color.","Japan copied the system in its 701 Taihō law code, and a 719 edict ordered everyone to wrap robes left side over right, as in China. Right over left was reserved for the dead, a rule still followed today."],"twist":"Over the Heian and Edo periods the robe evolved into the kosode and then the modern kimono, which China itself no longer wears."},{"id":"gagaku","emoji":"🎼","en":"Gagaku court music","ja":"雅楽","zh":"燕乐","era":"nara","arrive":"701","jp":"nara","cn":"changan","via":null,"cnWhen":"Tang banquet music, 600s–700s","lede":"The closest thing we have to the sound of the Tang court.","story":["The Tang court in Chang'an played yanyue (燕乐), banquet music that mixed Chinese, Central Asian and Indian styles.","Japan founded a court music bureau, the Gagakuryō, in 701. At the opening of the Great Buddha at Tōdai-ji in 752, musicians performed Tang, Korean and Southeast Asian pieces."],"twist":"China lost this music long ago. Japan's Imperial Household still performs it, making gagaku the oldest continuous orchestral tradition in the world."},{"id":"capitals","emoji":"🗺️","en":"Nara & Kyoto city grids","ja":"平城京・平安京","zh":"长安城","era":"nara","arrive":"710 / 794","jp":"nara","cn":"changan","via":null,"cnWhen":"Sui–Tang Chang'an, 582 onward","lede":"Japan's two ancient capitals were built as smaller copies of Chang'an.","story":["Chang'an was the largest city in the world, laid out on a strict grid with a grand central avenue, Zhuque Avenue (朱雀大街), running from the palace south to the main gate.","Nara (Heijō-kyō, 710) and then Kyoto (Heian-kyō, 794) copied the plan at about a quarter of the size, down to the name of the main road: Suzaku Ōji, the same characters 朱雀."],"twist":"Kyoto's streets still follow the Tang-style grid, and Kyoto addresses are given by crossing streets."},{"id":"instruments","emoji":"🪈","en":"Biwa, koto & shakuhachi","ja":"琵琶・箏・尺八","zh":"琵琶・筝・尺八","era":"nara","arrive":"700s","jp":"nara","cn":"changan","via":null,"cnWhen":"Tang dynasty, 618–907","lede":"Japan's classical instruments are Tang instruments.","story":["The pipa (lute) came to China from Central Asia, the zheng (zither) is native Chinese, and the chiba (尺八, a vertical bamboo flute) was a Tang court instrument. All were played in Chang'an.","The Shōsōin treasury in Nara still holds instruments sent over in the 700s, including the only surviving Tang five-string pipa in the world, inlaid with mother-of-pearl, and eight shakuhachi."],"twist":"Zen monks later made the shakuhachi a meditation instrument, and the koto became the instrument of Edo-period households."},{"id":"go","emoji":"⚫","en":"Go","ja":"囲碁","zh":"围棋","era":"nara","arrive":"By 700","jp":"nara","cn":"luoyang","via":null,"cnWhen":"Mentioned by c. 500 BCE","lede":"One of the oldest board games in the world.","story":["Weiqi (围棋, 'surrounding game') is mentioned in Chinese texts from the Spring and Autumn period and was a gentleman's art alongside music, calligraphy and painting.","Japan's 701 law code allowed monks to play go. The Shōsōin treasury holds a beautiful 8th-century go board of red sandalwood."],"twist":"Japan's Edo shoguns funded professional go houses, and the English word \"go\" comes from Japanese."},{"id":"tanabata","emoji":"🎋","en":"Tanabata","ja":"七夕","zh":"七夕","era":"nara","arrive":"700s","jp":"nara","cn":"changan","via":null,"cnWhen":"Han dynasty, 206 BCE–220 CE","lede":"The star-crossed lovers festival, on the 7th night of the 7th month.","story":["China's Qixi festival celebrates the Cowherd and the Weaver Girl, two stars who meet once a year across the Milky Way. Women prayed on this night for skill at weaving and needlework.","The Nara court adopted the festival in the 700s, with poetry and offerings. It merged with a native Japanese custom of a weaving maiden."],"twist":"Japan added the custom of writing wishes on paper strips and hanging them on bamboo, and moved the date to July 7."},{"id":"tango","emoji":"🎏","en":"Boys' Day (Tango no Sekku)","ja":"端午の節句","zh":"端午节","era":"nara","arrive":"700s","jp":"nara","cn":"miluo","via":null,"cnWhen":"Honors Qu Yuan, d. 278 BCE","lede":"Today's Children's Day started as China's Dragon Boat Festival.","story":["The Duanwu festival on the 5th day of the 5th month remembers the poet Qu Yuan, who drowned himself in the Miluo River. People hung calamus and mugwort to ward off disease.","The Nara court adopted the day with calamus (shōbu, 菖蒲) rituals."],"twist":"Samurai punned shōbu with 尚武 (\"honoring martial spirit\") and made it a boys' festival. Carp streamers come from the Chinese legend of a carp leaping the Dragon Gate. It became Children's Day, May 5, in 1948."},{"id":"tea","emoji":"🫖","en":"Tea (the first arrival)","ja":"茶","zh":"茶","era":"heian","arrive":"815","jp":"otsu","cn":"changan","via":null,"cnWhen":"Tang tea culture, Lu Yu's Classic of Tea, c. 760","lede":"Tea came to Japan twice. This is the first time.","story":["Tea came from southwest China, and by the Tang dynasty tea drinking was fashionable across the empire. Lu Yu wrote the world's first book on tea around 760.","The monk Eichū (永忠) lived in Chang'an for about 30 years. In 815 he served tea to Emperor Saga at Bonshaku-ji near Lake Biwa, the first reliable record of tea drinking in Japan."],"twist":"When Japan stopped sending missions to China in 894, tea drinking faded. It came back 300 years later as matcha."},{"id":"calligraphy","emoji":"🖌️","en":"Calligraphy","ja":"書道","zh":"书法","era":"heian","arrive":"806","jp":"kyoto","cn":"shaoxing","via":null,"cnWhen":"Wang Xizhi, 303–361","lede":"Brush writing as a fine art.","story":["Wang Xizhi, the \"Sage of Calligraphy\", wrote the Orchid Pavilion Preface at Shaoxing in 353. It became the model for calligraphers across East Asia.","Brush writing came with kanji, but the art was established by the monk Kūkai, who studied in Chang'an and returned in 806. He is counted among Japan's \"Three Brushes\" (三筆)."],"twist":"Heian court ladies developed flowing kana calligraphy, a style with no Chinese equivalent."},{"id":"tsukimi","emoji":"🎑","en":"Moon viewing (Tsukimi)","ja":"お月見","zh":"中秋赏月","era":"heian","arrive":"800s","jp":"kyoto","cn":"changan","via":null,"cnWhen":"Tang dynasty, 618–907","lede":"Japan's autumn moon parties come from the Mid-Autumn Festival.","story":["Tang poets in Chang'an made admiring the full moon of the 8th month a literary tradition. It grew into the Mid-Autumn Festival.","Heian aristocrats in Kyoto held moon-viewing parties, writing poems and watching the moon reflected in ponds from boats."],"twist":"Japan swapped mooncakes for round tsukimi dango and pampas grass, and added a second viewing a month later (十三夜) that China doesn't have."},{"id":"tofu","emoji":"🍲","en":"Tofu","ja":"豆腐","zh":"豆腐","era":"heian","arrive":"First record 1183","jp":"nara","cn":"huainan","via":null,"cnWhen":"Legend: Han dynasty; clear records by the 900s","lede":"Temple food that became everyday food.","story":["Legend credits Liu An, the Prince of Huainan (2nd century BCE), with inventing tofu. The first clear written mention in China is from the 900s.","The first Japanese record is from 1183, in the diary of a priest at Kasuga Shrine in Nara. Buddhist monks spread it through vegetarian temple cooking (shōjin ryōri)."],"twist":"Japan developed silken tofu, agedashi and yudofu, and the Edo cookbook Tofu Hyakuchin (1782) gave 100 tofu recipes."},{"id":"matcha","emoji":"🍵","en":"Matcha","ja":"抹茶","zh":"点茶 (Song whisked tea)","era":"kamakura","arrive":"1191","jp":"seburi","cn":"tiantai","via":null,"cnWhen":"Song dynasty, 960–1279","lede":"Powdered, whisked green tea was a Song dynasty fashion.","story":["In Song China, tea leaves were steamed, dried, ground to powder and whisked into a froth in a bowl. Zen monasteries in Zhejiang used it to stay awake during meditation, and people held whisking contests (斗茶).","The Japanese monk Eisai studied at Mount Tiantai and returned in 1191 with tea seeds. He planted them on Mount Seburi in Kyushu, and in 1211 wrote Japan's first tea book, Kissa Yōjōki, praising tea as medicine.","Eisai gave seeds to the monk Myōe near Kyoto, and from there tea spread to Uji, still Japan's most famous matcha region."],"twist":"In 1391 the Ming emperor banned pressed tea cakes, and China moved to steeped loose-leaf tea. The whisked powdered tea survived only in Japan, where Sen no Rikyū shaped it into the tea ceremony in the 1500s."},{"id":"zen","emoji":"🧘","en":"Zen","ja":"禅","zh":"禅宗","era":"kamakura","arrive":"1191 / 1227","jp":"hakata","cn":"ningbo","via":null,"cnWhen":"Chan school, Tang–Song dynasties","lede":"\"Zen\" is simply the Japanese reading of Chinese \"Chan\" (禅).","story":["Chan Buddhism, focused on meditation and direct insight, traces itself to Bodhidharma at Shaolin and flowered in the Tang and Song dynasties. The great Zhejiang monasteries such as Tiantong near Ningbo trained monks from across Asia.","Eisai brought Rinzai Zen back in 1191 and founded Shōfuku-ji in Hakata in 1195, Japan's first Zen temple. Dōgen studied at Tiantong and brought Sōtō Zen home in 1227."],"twist":"Zen shaped rock gardens, the tea ceremony, ink painting and samurai culture, and Japanese teachers later brought it to the West."},{"id":"miso","emoji":"🫘","en":"Miso & soy sauce","ja":"味噌・醤油","zh":"酱・酱油","era":"kamakura","arrive":"700s / 1254","jp":"yuasa","cn":"hangzhou","via":null,"cnWhen":"Jiang pastes from the Zhou dynasty","lede":"Japanese seasoning grew out of Chinese fermented bean paste.","story":["China has made jiang (酱), fermented pastes of beans, grain or meat, for over 2,500 years. Japan's 701 law code already mentions its relative, hishio (醤).","Tradition says the monk Kakushin returned in 1254 from Jingshan Temple near Hangzhou with a recipe for miso. At Yuasa, the liquid that pooled at the bottom of the miso barrels became Japanese soy sauce."],"twist":"Yuasa is still known as the birthplace of Japanese soy sauce, and Japan developed its own lighter, wheat-rich style."},{"id":"bonsai","emoji":"🪴","en":"Bonsai","ja":"盆栽","zh":"盆景","era":"kamakura","arrive":"1100s–1300s","jp":"kyoto","cn":"changan","via":null,"cnWhen":"Tang dynasty; tomb mural 706","lede":"Miniature trees in a pot started as Chinese penjing.","story":["A mural in the tomb of Tang Prince Zhanghuai near Chang'an, dated 706, shows a servant carrying a tiny landscape with trees in a dish. Chinese penjing (盆景) recreated whole landscapes in miniature.","Japanese monks and aristocrats brought the art back. A picture scroll from 1309, the Kasuga Gongen Genki-e, shows potted dwarf trees in a Kyoto house."],"twist":"Japan focused on the single perfect tree, and the word \"bonsai\" (the Japanese reading of 盆栽, 'tray planting') is what the world uses."},{"id":"ink","emoji":"🏔️","en":"Ink painting","ja":"水墨画","zh":"水墨画","era":"kamakura","arrive":"1200s–1467","jp":"yamaguchi","cn":"hangzhou","via":null,"cnWhen":"Tang–Song dynasties","lede":"Black ink, water and empty space.","story":["Monochrome ink painting peaked in Song China. Monk painters around Hangzhou, above all Muqi (牧谿), painted misty landscapes and simple subjects with a few strokes.","Zen monks carried these paintings to Japan, where Muqi was treasured more than in China. The painter Sesshū traveled to Ming China in 1467–69, then worked from his studio in Yamaguchi."],"twist":"Sesshū is often called Japan's greatest painter, and Japanese ink painting led to the Kano school and later sumi-e."},{"id":"shamisen","emoji":"🪕","en":"Shamisen","ja":"三味線","zh":"三弦","era":"kamakura","arrive":"1560s","jp":"sakai","cn":"fuzhou","via":"okinawa","cnWhen":"Yuan–Ming dynasties","lede":"China to Okinawa to Osaka.","story":["The Chinese sanxian (三弦), a three-string lute covered in snakeskin, came to the Ryukyu Kingdom (Okinawa) with Chinese settlers from Fujian and became the sanshin.","Around the 1560s a sanshin arrived at the busy trading port of Sakai near Osaka. Japanese players replaced the snakeskin, which was hard to get, with cat or dog skin and played it with a large plectrum."],"twist":"The shamisen became the voice of kabuki and bunraku puppet theater, geisha songs, and later the fast Tsugaru style."},{"id":"daruma","emoji":"🔴","en":"Daruma doll","ja":"だるま","zh":"达摩","era":"modern","arrive":"1780s","jp":"takasaki","cn":"shaolin","via":null,"cnWhen":"Bodhidharma, c. 500","lede":"A good-luck doll based on the founder of Chan Buddhism.","story":["Bodhidharma (达摩, Daruma in Japanese) is said to have meditated facing a wall at Shaolin Temple for nine years, until his legs withered away.","He arrived in Japan with Zen, but the round, legless papier-mâché doll comes from Shōrinzan Daruma-ji in Takasaki, where farmers began making them during a famine in the 1780s. The temple's name, Shōrinzan, is Japanese for \"Shaolin mountain\"."],"twist":"You fill in one eye when you set a goal and the other when you reach it, a purely Japanese custom."},{"id":"ramen","emoji":"🍜","en":"Ramen","ja":"ラーメン","zh":"拉面 / 汤面","era":"modern","arrive":"1859–1910","jp":"yokohama","cn":"guangzhou","via":null,"cnWhen":"Chinese wheat noodle soups","lede":"Japan's national dish was once called \"Chinese soba\".","story":["After Japan opened its ports in 1859, Chinese merchants and cooks, many from Guangdong, settled in Yokohama and served wheat noodles in broth.","In 1910 Rairaiken opened in Asakusa, Tokyo, with Cantonese cooks serving noodle soup to Japanese customers. It was called shina soba or chūka soba (\"Chinese soba\")."],"twist":"Japan built regional styles (tonkotsu, miso, shoyu) and in 1958 Momofuku Ando invented instant ramen."},{"id":"karate","emoji":"🥋","en":"Karate","ja":"空手","zh":"唐手 (Chinese boxing)","era":"modern","arrive":"1392 → 1922","jp":"naha","cn":"fuzhou","via":null,"cnWhen":"Fujian styles such as White Crane","lede":"It was first written 唐手, \"Tang hand\".","story":["In 1392, 36 families from Fujian settled at Kumemura in Naha, and Okinawans traveled to Fuzhou to trade and study. Chinese boxing mixed with local Okinawan fighting arts.","The result was called tōde (唐手). In 1922 Funakoshi Gichin demonstrated it in Tokyo, and in 1936 Okinawan masters agreed to write it 空手, \"empty hand\"."],"twist":"Karate became an Olympic sport at the Tokyo 2020 Games."},{"id":"gyoza","emoji":"🥟","en":"Gyoza","ja":"餃子","zh":"饺子","era":"modern","arrive":"After 1945","jp":"utsunomiya","cn":"shenyang","via":null,"cnWhen":"Jiaozi, eaten for about 1,800 years","lede":"Brought home by Japanese returning from Manchuria.","story":["Jiaozi dumplings are a staple of northern China, especially at Lunar New Year.","Millions of Japanese soldiers and settlers returned from Manchuria after 1945, and many opened dumpling stalls. The city of Utsunomiya, whose army division had been stationed in Manchuria, became Japan's gyoza capital."],"twist":"In China jiaozi are usually boiled. Japan made pan-fried yaki-gyoza the standard, with a crispy bottom."}];

function curve(a,b,bend){
  const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1];
  let nx=-dy,ny=dx; if(ny>0){nx=-nx;ny=-ny}
  return `Q${(mx+nx*bend).toFixed(1)} ${(my+ny*bend).toFixed(1)} ${b[0]} ${b[1]}`;
}
function routeD(it){
  const o=GEO.cn[it.cn].xy, d=GEO.jp[it.jp].xy, pts=[o];
  if(it.via==="korea") pts.push(GEO.korea_pt);
  if(it.via==="okinawa") pts.push(GEO.jp.naha.xy);
  pts.push(d);
  let s=`M${o[0]} ${o[1]}`;
  for(let i=1;i<pts.length;i++) s+=curve(pts[i-1],pts[i],0.2);
  return s;
}

  routeG.innerHTML="";labelG.innerHTML="";
  if(anim)cancelAnimationFrame(anim);
  const p=el("path",{d:routeD(it),class:"route"},routeG);
  const L=p.getTotalLength();
  const o=GEO.cn[it.cn].xy, j=GEO.jp[it.jp].xy, b=GEO.bubbles[it.id];
  plabel(o[0],o[1]-12,GEO.cn[it.cn].label,"cn");
  if(it.via==="korea") plabel(GEO.korea_pt[0]+4,GEO.korea_pt[1]+26,"via Baekje","cn");
  plabel(j[0]+(j[0]<b[0]?-8:8), j[1]+(j[1]<b[1]?-10:18), GEO.jp[it.jp].label,"jp", j[0]<b[0]?"end":"start");
  const dot=el("circle",{r:4.5,class:"traveler"},routeG);
  if(!animate||reduce){const e=p.getPointAtLength(L);dot.setAttribute("cx",e.x);dot.setAttribute("cy",e.y);return}
  p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
  const t0=performance.now(),dur=1300;
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    p.style.strokeDashoffset=L*(1-e);
    const pt=p.getPointAtLength(L*e);dot.setAttribute("cx",pt.x);dot.setAttribute("cy",pt.y);
    if(k<1)anim=requestAnimationFrame(step);
  };
  anim=requestAnimationFrame(step);
}

const label=document.getElementById("label");
let storyOpen=false;
function renderLabel(it){
  const era=eraById[it.era], idx=ORDER.indexOf(it.id);
  const prev=ORDER[(idx+ORDER.length-1)%ORDER.length], next=ORDER[(idx+1)%ORDER.length];
  const via=it.via==="korea"?" <small>· via Baekje, Korea</small>":it.via==="okinawa"?" <small>· via Okinawa</small>":"";
  label.innerHTML=`
    <div class="top"><div><h2>${it.emoji}&nbsp; ${esc(it.en)}</h2><div class="names">${it.ja} · ${it.zh}</div></div><div class="yr">${esc(it.arrive)}</div></div>
    <p class="lede">${esc(it.lede)}</p>
    <dl class="route-line">
      <dt>From</dt><dd><span class="cnp">${esc(GEO.cn[it.cn].label)}</span> <small>· ${esc(it.cnWhen)}</small></dd>
      <dt>To</dt><dd>${esc(GEO.jp[it.jp].label)} <small>· ${era.name} period</small>${via}</dd>
    </dl>
    <details ${storyOpen?"open":""}><summary>The story</summary>
      ${it.story.map(p=>`<p>${esc(p)}</p>`).join("")}
      <p class="jp">In Japan: ${esc(it.twist)}</p>
    </details>
    <div class="pager"><button type="button" data-go="${prev}">← ${esc(byId[prev].en)}</button><button type="button" data-go="${next}">${esc(byId[next].en)} →</button></div>`;
  label.querySelector("details").addEventListener("toggle",e=>{storyOpen=e.target.open});
  label.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
}

// swatch grid by era
const grid=document.getElementById("grid");
const sws={};
for(const era of ERAS){
  const box=document.createElement("div");box.className="era";
  box.innerHTML=`<div class="cap"><span>${era.name}</span><span>${era.span}</span></div>`;
  const sw=document.createElement("div");sw.className="sw";
  for(const id of ORDER.filter(i=>byId[i].era===era.id)){
    const it=byId[id],b=document.createElement("button");
    b.type="button";b.className="s";b.setAttribute("aria-label",`${it.en}, ${YEAR[id]}`);
    b.innerHTML=`<span class="dot" aria-hidden="true">${it.emoji}</span><span class="t">${esc(SHORT[id]||it.en)}<span>${YEAR[id]}</span></span>`;
    b.onclick=()=>select(id,true);
    sw.appendChild(b);sws[id]=b;
  }
  box.appendChild(sw);grid.appendChild(box);
}
const page=()=>Math.max(200,grid.clientWidth*0.8);
document.getElementById("left").onclick=()=>grid.scrollBy({left:-page()});
document.getElementById("right").onclick=()=>grid.scrollBy({left:page()});
function centerChip(id,smooth){
  const b=sws[id], left=b.offsetLeft-(grid.clientWidth-b.offsetWidth)/2;
  grid.scrollTo({left,behavior:smooth&&!reduce?"smooth":"auto"});
}

function select(id,animate){
  const it=byId[id]; if(!it)return;
  if(current){bubs[current].classList.remove("on");leaders[current].classList.remove("on");originDots[byId[current].cn].classList.remove("on");sws[current].classList.remove("on");sws[current].removeAttribute("aria-current")}
  current=id;
  const g=bubs[id];g.classList.add("on");g.parentNode.appendChild(g);
  leaders[id].classList.add("on");originDots[it.cn].classList.add("on");
  sws[id].classList.add("on");sws[id].setAttribute("aria-current","true");
  drawRoute(it,animate);renderLabel(it);centerChip(id,animate);
  try{history.replaceState(null,"","#"+id)}catch(e){}
}
const start=(location.hash||"").slice(1);
select(byId[start]?start:"matcha",false);
</script>
