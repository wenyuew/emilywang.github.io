<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vantage · Emily Wang</title>
<meta name="description" content="Vantage: a six-week agentic AI build, written as weekly mini PRDs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ffffff; --surface:#f6f6f7; --surface-2:#efeff1; --line:#e7e7ea; --curve:#d4d4d8;
  --ink:#141416; --text:#46464c; --muted:#8a8a91; --faint:#b3b3b9;
  --pill:#111113; --pill-ink:#ffffff; --good:#3f7d5a; --bad:#b0513b;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101012; --surface:#18181b; --surface-2:#202024; --line:#2a2a2f; --curve:#3a3a40;
    --ink:#f3f3f5; --text:#c2c2c8; --muted:#8c8c94; --faint:#5e5e66;
    --pill:#f3f3f5; --pill-ink:#111113; --good:#7fbf98; --bad:#e08b74;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101012; --surface:#18181b; --surface-2:#202024; --line:#2a2a2f; --curve:#3a3a40;
  --ink:#f3f3f5; --text:#c2c2c8; --muted:#8c8c94; --faint:#5e5e66;
  --pill:#f3f3f5; --pill-ink:#111113; --good:#7fbf98; --bad:#e08b74;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:20px;padding-block:0 72px;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:22px;border-bottom:1px solid var(--line);margin-bottom:48px}
.brand{font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.bar-r{display:flex;align-items:center;gap:18px}
.back{font-size:12.5px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.crumb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.12;font-weight:500;color:var(--ink);letter-spacing:-.025em;margin:0 0 16px;text-wrap:balance}
h2{font-size:22px;line-height:1.25;font-weight:500;color:var(--ink);letter-spacing:-.015em;margin:0 0 10px;text-wrap:balance}
h3{font-size:14px;font-weight:600;color:var(--ink);margin:0 0 6px}
.lede{font-size:16.5px;color:var(--text);max-width:62ch;margin:0}
.caption{font-size:12.5px;color:var(--faint);max-width:60ch;margin:6px 0 0}
section.block{margin-top:64px}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 18px;display:block}
p{margin:0 0 12px}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);color:var(--ink);padding:1px 6px;border-radius:5px;white-space:normal}

/* convergence diagram */
.flow{margin-top:36px;overflow-x:auto}
.flow svg{display:block;width:100%;min-width:560px;height:auto}
.flow .lbl{font:13px var(--sans);fill:var(--text)}
.flow .curve{fill:none;stroke:var(--curve);stroke-width:1.2}
.flow .dot{fill:var(--faint)}
.flow .pill{fill:var(--pill)}
.flow .pill-t{font:500 15px var(--sans);fill:var(--pill-ink)}
@media (prefers-reduced-motion:no-preference){
  .flow .curve{stroke-dasharray:400;stroke-dashoffset:0;animation:draw 1.1s ease-out both}
  @keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
}

/* grid of cells */
.grid{display:grid;gap:2px;background:var(--bg);border-radius:14px;overflow:hidden}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.cell{background:var(--surface);padding:24px 24px 28px;min-width:0}
.cell .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;margin-bottom:18px;display:block}
.cell p{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0}
.cell p + p{margin-top:8px}
.cell ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--text)}
.cell li{margin-bottom:6px}
@media (max-width:720px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.g3,.g2{grid-template-columns:1fr}}

/* section cards on overview */
a.card{text-decoration:none;display:flex;flex-direction:column;transition:background .2s}
a.card:hover{background:var(--surface-2)}
a.card .icon{width:64px;height:64px;margin:-4px 0 18px -6px;transition:transform .35s ease}
a.card:hover .icon{transform:translateY(-3px) scale(1.06)}
a.card .top{display:flex;justify-content:space-between;align-items:baseline}
a.card .state{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
a.card .state.live{color:var(--ink)}
a.card .go{margin-top:auto;padding-top:16px;font-size:12.5px;color:var(--ink)}

/* facts row */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.facts dt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.facts dd{margin:0;color:var(--ink);font-size:14.5px;line-height:1.45}
@media (max-width:560px){.facts{grid-template-columns:1fr}}

/* stories */
.stories{display:grid;gap:2px;border-radius:14px;overflow:hidden}
.story{background:var(--surface);padding:20px 24px;display:grid;grid-template-columns:150px 1fr;gap:18px}
.story .who{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding-top:3px}
.story q{display:block;color:var(--ink);font-size:15px;quotes:"\201C" "\201D";margin-bottom:4px}
.story p{font-size:13.5px;color:var(--muted);margin:0}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:1px}
@media (max-width:560px){.story{grid-template-columns:1fr;gap:6px}}

.in-out .h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;display:block}
.in-out .in .h{color:var(--good)} .in-out .out .h{color:var(--bad)}
.in-out .out li{color:var(--muted)}

/* criteria */
.checks{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:10px;color:var(--text)}
.checks li::before{content:"";width:14px;height:14px;border:1.3px solid var(--muted);border-radius:4px;margin-top:5px}

/* table */
.tbl{overflow-x:auto;border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:16px 20px 12px;border-bottom:1px solid var(--line)}
td{padding:13px 20px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text)}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--ink)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-mini{display:block;height:4px;border-radius:2px;background:var(--surface-2);margin-top:7px;position:relative;width:120px}
.bar-mini i{position:absolute;top:0;height:4px;border-radius:2px;background:var(--ink);opacity:.75}

.note{font-size:14px;color:var(--text);margin-top:16px}
.deel{background:var(--pill);color:var(--pill-ink);border-radius:14px;padding:28px}
.deel .label{color:var(--pill-ink);opacity:.6}
.deel p,.deel li{color:var(--pill-ink);opacity:.88}
.deel ul{margin:12px 0 0;padding-left:18px;display:grid;gap:8px;font-size:14px}
blockquote{margin:0;font-size:19px;line-height:1.5;color:var(--ink);letter-spacing:-.01em;max-width:58ch}
blockquote cite{display:block;font-style:normal;font-size:12px;color:var(--faint);margin-top:12px;letter-spacing:.1em;text-transform:uppercase}

.pager{display:flex;justify-content:space-between;gap:16px;margin-top:72px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;display:flex;flex-direction:column;gap:2px;max-width:48%}
.pager a small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.pager a span{color:var(--ink)}
.pager a.next{text-align:right;margin-left:auto}
.soon{background:var(--surface);border-radius:14px;padding:28px;margin-top:36px}
.soon p{color:var(--muted);max-width:60ch}
.hero-icon{width:88px;height:88px;margin:0 0 20px -8px}

/* day-by-day rows */
.days{display:grid;gap:2px;border-radius:14px;overflow:hidden}
.day{background:var(--surface);padding:22px 24px;display:grid;grid-template-columns:90px 1fr;gap:18px}
.day .d{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding-top:2px}
.day p,.day li{font-size:14px;color:var(--text);max-width:68ch}
.day ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
.day li b{color:var(--ink);font-weight:600}
.day table{min-width:460px;font-size:13px}
.day .tbl{background:var(--bg);margin:10px 0 12px}
@media (max-width:560px){.day{grid-template-columns:1fr;gap:6px}}
pre{font-family:var(--mono);font-size:12.5px;line-height:1.65;background:var(--surface-2);color:var(--ink);padding:16px 18px;border-radius:10px;overflow-x:auto;margin:10px 0 12px;max-width:100%}
.docs{display:grid;gap:2px;border-radius:14px;overflow:hidden}
.doc{background:var(--surface);padding:20px 24px;display:grid;grid-template-columns:190px 1fr;gap:18px}
.doc .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);padding-top:3px}
.doc p{margin:0;font-size:14px;color:var(--text)}
@media (max-width:560px){.doc{grid-template-columns:1fr;gap:6px}}
.story .scene{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.goal-grid .cell p{color:var(--text);font-size:14px}
.prose p{max-width:62ch;color:var(--text)}
.soon{background:var(--surface);border-radius:14px;padding:28px;margin-top:36px}
.soon p{color:var(--muted);max-width:60ch;margin:0}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="bs" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
</svg>

<div class="wrap">
  <header class="bar">
    <a class="brand" href="#overview">Vantage</a>
    <span class="bar-r"><span class="crumb" id="crumb">Overview</span><a class="back" href="../">← Emily Wang</a></span>
  </header>
  <main id="app"></main>

<script>
/* ---------- icons: soft blurred forms ---------- */
const ICONS = {
  arc:`<svg viewBox="0 0 64 64" class="icon" aria-hidden="true">
    <path d="M14 22 A22 22 0 0 1 50 46" fill="none" stroke="#ef7fae" stroke-width="10" filter="url(#bl)" opacity=".75"/>
    <path d="M14 22 A22 22 0 0 1 50 46" fill="none" stroke="#c9c2a8" stroke-width="7" filter="url(#bs)"/>
    <path d="M15 23 A21 21 0 0 1 49 45" fill="none" stroke="#2a2a2e" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  cone:`<svg viewBox="0 0 64 64" class="icon" aria-hidden="true">
    <ellipse cx="32" cy="40" rx="18" ry="8" fill="#3a3fd9" filter="url(#bl)" opacity=".85"/>
    <ellipse cx="32" cy="40" rx="10" ry="4" fill="#5b6cff" filter="url(#bs)"/>
    <path d="M32 18 L39 39 L25 39 Z" fill="#1c1c22"/></svg>`,
  flame:`<svg viewBox="0 0 64 64" class="icon" aria-hidden="true">
    <ellipse cx="32" cy="42" rx="9" ry="14" fill="#f3b4d6" filter="url(#bl)" opacity=".8"/>
    <ellipse cx="32" cy="26" rx="8" ry="10" fill="#f06a8a" filter="url(#bl)"/>
    <ellipse cx="32" cy="27" rx="4" ry="6" fill="#ff8a1f" filter="url(#bs)"/></svg>`,
  drop:`<svg viewBox="0 0 64 64" class="icon" aria-hidden="true">
    <rect x="24" y="24" width="16" height="30" rx="8" fill="#b8b6ee" filter="url(#bl)" opacity=".8"/>
    <circle cx="32" cy="22" r="10" fill="#141416"/></svg>`,
  eye:`<svg viewBox="0 0 64 64" class="icon" aria-hidden="true">
    <circle cx="32" cy="32" r="18" fill="#f2a7ac" filter="url(#bl)" opacity=".85"/>
    <circle cx="32" cy="32" r="11" fill="#c24a55" filter="url(#bs)" opacity=".8"/>
    <circle cx="32" cy="32" r="4.5" fill="#1a1012"/></svg>`,
  ring:`<svg viewBox="0 0 64 64" class="icon" aria-hidden="true">
    <ellipse cx="32" cy="18" rx="7" ry="10" fill="#f2d64b" filter="url(#bl)"/>
    <rect x="26" y="20" width="12" height="20" rx="6" fill="#e3cdea" filter="url(#bl)"/>
    <circle cx="32" cy="45" r="8" fill="none" stroke="#1a1a1e" stroke-width="4.5"/></svg>`
};
const c = s => `<code>${s}</code>`;
const table = (head, rows) => `<div class="tbl"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

/* ---------- content ---------- */
const WEEKS = [
{
  id:"week-1", n:1, icon:"arc", tag:"Baseline", title:"Synthetic world + naive Q&amp;A",
  goal:"Maya can ask a compliance question in a chat box and get an answer. The system is deliberately simple so you get a real baseline number and a list of how it fails.",
  hypothesis:"Plain retrieval handles single-fact questions fine but fails on conditional questions (tenure, contract type), handbook-vs-law conflicts, and questions the docs don't cover.",
  done:"60 questions run end to end, every answer graded by hand, and a written baseline memo.",
  flowTarget:["Baseline memo"],
  stories:[
    ["Maya · Northwind Studio","How many days of annual leave does a full-time EOR employee in the UK get?","Gets an answer in under 10 seconds. (Single-fact: should work even in W1.)"],
    ["Maya · Northwind Studio","What's the notice period for an EOR employee in Germany who's been with us 3 years?","Needs tenure logic. Expect W1 to answer with the generic minimum and ignore the 3 years."],
    ["Maya · Northwind Studio","Our UK team gets 30 days off per our handbook — is that allowed?","Handbook-vs-law conflict. Expect W1 to pick one source at random."]
  ],
  scopeIn:["Synthetic data tables + generator script","12 country guides, 3 client handbooks","One chat page, no login","Fixed 500-token chunks, embeddings, top-5 retrieval","One model call, plain text answer","60-question eval sheet, graded by hand"],
  scopeOut:["Tools and workforce data questions","Citations, metadata filters","Any action or drafting","Vantage Desk","Model routing, cost work"],
  days:[
    ["Data model and generator",`<p>Write the tables and a seeded generator (${c("seed=42")}) so every eval run sees the same world.</p>
      <ul><li>${c("clients")}: Northwind Studio, Kite Robotics, Loma Foods</li>
      <li>${c("workers")}: 500 rows. Example: ${c("W-0217 · Ana Costa · BR · contractor · Northwind · €70/h · start 2024-02-12")}</li>
      <li>${c("contracts")}, ${c("invoices")}, ${c("payments")} (≈3,000 rows, ~4% failed, with a ${c("failure_reason")}), ${c("tickets")} (150, filled in W4)</li>
      <li>Plant test subjects on purpose: two workers named Ana at different clients, one German EOR employee (Jonas Weber, start 2023-03-01) for tenure questions</li></ul>`],
    ["Knowledge docs",`<p>Draft 12 country guides with the same seven sections so chunking and evals stay comparable: 1 Worker types · 2 Contracts · 3 Working time &amp; leave · 4 Notice &amp; termination · 5 Tax &amp; social security · 6 Invoicing &amp; payment · 7 Misclassification risk. Base them on public government sources, simplify, and stamp every page "Synthetic, simplified, not legal advice." Then write the 3 client handbooks with planted conflicts: Northwind gives UK staff 30 days leave; Kite sets a 6-month probation in Germany; Loma's handbook is silent on Brazil.</p>
      <ul><li>Keep a ${c("facts.csv")} as you write: every fact you plan to test, with doc and section. It becomes your gold answers.</li></ul>`],
    ["Naive pipeline",`<p>Load docs → split every 500 tokens → embed → top-5 by similarity → one call with a plain prompt: "You are an HR compliance assistant. Answer the user's question using the context." Build on the OpenAI Responses API or the Claude Agent SDK directly. Minimal chat UI: input, answer, spinner.</p>`],
    ["Eval set",`<p>Write 60 questions in a sheet with columns ${c("id · question · country · type · gold_answer · gold_source · notes")}.</p>
      <ul><li>25 single-fact: "What's the standard VAT rate on contractor invoices in the Netherlands?"</li>
      <li>15 conditional: "Notice period in Germany after 3 years?"</li>
      <li>8 conflict: "Northwind handbook says 30 days — what applies?"</li>
      <li>7 unanswerable: "What's the parental leave rule in Japan?" (Japan isn't covered)</li>
      <li>5 out of scope: "Should we fire Jonas?"</li></ul>`],
    ["Run, grade, write it up",`<p>Run all 60. Grade each answer as ${c("correct · partial · wrong · hallucinated · should_have_refused")} and add a one-line reason. Tag every failure with a draft category. Write the baseline memo.</p>`]
  ],
  criteria:["One command regenerates the world identically","All 60 questions run with no crashes; answers saved with the question id","Every answer graded; accuracy reported per question type, not just overall","At least 10 failures written up with the exact question, answer and why it's wrong"],
  probablyTable:{head:["Question type","Likely W1 range","Typical failure"],rows:[
    ["Single-fact","70–85%","Wrong country's chunk retrieved (DE vs AT)"],
    ["Conditional","35–55%","Ignores tenure or contract type, gives a generic minimum"],
    ["Conflict","10–30%","Quotes the handbook or the law, never both"],
    ["Unanswerable","refuses 0–20%","Confidently answers Japan from general knowledge"],
    ["Out of scope","refuses ~40%","Gives termination advice it shouldn't"]]},
  probably:"A bad week-1 score is a good result. The breakdown by question type is the whole plan for week 2.",
  docs:[["Baseline memo","One page: what was built, accuracy by question type, the top three failure patterns with one real example each, and what week 2 will fix and why, in that order."]],
  deelIntro:"Discovery and baselining before you commit a roadmap. The work would look like this:",
  deel:["Pulling a sample of a few hundred real compliance questions from assistant logs and support tickets with a data scientist, and building the question-type taxonomy yourself.",
    "Writing labeling guidelines and negotiating time from in-house legal and compliance experts to write gold answers. Expert time is scarce, so deciding which questions get labeled first is a PM call.",
    "Measuring the current assistant against that set so every later claim of \"better\" has a number behind it.",
    "Running a short review with engineering on which failure class to attack first."],
  cut:"go from 12 countries to 6 and from 60 questions to 40, but keep all five question types.",
  quote:"Before changing anything, I built a naive version and a 60-question eval split by question type. The overall score was fine; conditional and conflict questions were not — and that split set the whole roadmap."
},
{
  id:"week-2", n:2, icon:"cone", tag:"Tools", title:"Read-only tools, citations, tracing",
  goal:"Answers are grounded and cited, workforce questions are answered from actual records, and every turn leaves a trace you can inspect.",
  hypothesis:"Most W1 failures come from missing or wrong context (country, tenure, contract type), not from the model's reasoning.",
  done:"Suites 1 and 2 running, a trace for every turn, and a named top failure category.",
  flowTarget:["Threshold decision note"],
  stories:[
    ["Maya · Workforce data","Which of our contractors in France have contracts ending this quarter?",`Agent calls ${c('get_workers(country="FR", type="contractor", contract_end_before="2026-12-31")')} and shows a table with name, role and end date. The count comes from rows, never from the model.`],
    ["Maya · Conditional compliance","What notice do we need to give Jonas Weber?",`Resolves Jonas → ${c("get_contract")} → Germany, EOR, start 2023-03-01 → searches the DE guide §4 → applies tenure → answers with ${c("[DE-Guide §4.2]")}.`],
    ["Maya · Conflict","Our handbook says 30 days leave for UK staff. Is that OK?",`Shows both: statutory minimum ${c("[UK-Guide §3.1]")} and Northwind's 30 days ${c("[Northwind-Handbook §2.4]")}; states the handbook applies because it's more generous.`],
    ["Maya · Not covered","What's parental leave in Japan?",`"I don't have guidance for Japan yet." No answer from general knowledge.`]
  ],
  scopeIn:["Heading-aware chunking with metadata","Country pre-filter and reranking","Two knowledge layers plus a precedence rule","Required citations and a grounding floor","4 read-only tools, tenant-scoped","Trace log and trace viewer","Failure taxonomy v1"],
  scopeOut:["Drafts, tickets, any write action","Vantage Desk","Routing and caching","LLM-as-judge (still grading by hand)"],
  days:[
    ["Rebuild retrieval",`<p>Split on H2/H3 headings, 300–450 tokens, keep tables whole even if oversized, 50-token overlap inside a document only. Every chunk gets ${c("{country, layer, client_id, section_id, title, effective_date}")}. Filter by country (and client for handbooks) before similarity search, retrieve 8, rerank, keep 5.</p>`],
    ["Tools",`<p>Define four read-only tools. ${c("client_id")} is injected from the session, never a parameter the model can set.</p>
<pre>get_workers(country?, type?: "contractor"|"eor",
            contract_end_before?, status?) → [{worker_id, name,
            country, type, contract_end}]
get_contract(worker_id | contract_id) → {type, start_date, rate,
            currency, notice_clause, probation_end}
get_payments(worker_id?, status?, date_from?, date_to?)
search_knowledge(query, country?, layer?)</pre>`],
    ["Grounding rules",`<ul>
      <li><b>Precedence:</b> statutory minimum is always stated. A client policy applies if it's more generous to the worker. If it's less generous, flag it as a possible compliance issue.</li>

function flowSVG(items, target){
  const W=640, rowH=26, top=14, H=Math.max(top*2+rowH*(items.length-1),70);
  const pillW=210, pillH=52, px=W-pillW-4, cy=H/2, x0=250;
  const y0 = cy - rowH*(items.length-1)/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${items.join(', ')} lead to ${target.join(' ')}">`;
  items.forEach((t,i)=>{
    const y=y0+i*rowH;
    s+=`<text class="lbl" x="0" y="${y+4}">${t}</text><circle class="dot" cx="${x0}" cy="${y}" r="2.2"/>`;
    s+=`<path class="curve" d="M${x0+4} ${y} C ${x0+180} ${y}, ${px-120} ${cy}, ${px} ${cy}"/>`;
  });
  s+=`<rect class="pill" x="${px}" y="${cy-pillH/2}" width="${pillW}" height="${pillH}" rx="8"/>`;
  target.forEach((t,i)=>{ s+=`<text class="pill-t" x="${px+pillW/2}" y="${cy+(i-(target.length-1)/2)*19+5}" text-anchor="middle">${t}</text>`; });
  return `<div class="flow">${s}</svg></div>`;
}

  ${w.targets?`<section class="block"><span class="label">${w.targets.label}</span>${table(w.targets.head,w.targets.rows)}${w.targets.after?`<ul class="checks" style="margin-top:20px">${w.targets.after.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}</section>`:""}

  ${w.probably?`<section class="block">
    <span class="label">What you'll probably see</span>
    ${w.probablyTable?table(w.probablyTable.head,w.probablyTable.rows):""}
    <p class="note">${w.probably}</p>
  </section>`:""}

  <section class="block">
    <span class="label">PM document${w.docs.length>1?'s':''} you produce</span>
    <div class="docs">${w.docs.map(d=>`<div class="doc"><span class="k">${d[0]}</span><p>${d[1]}</p></div>`).join("")}</div>
  </section>

  <section class="block">
    <div class="deel">
      <span class="label">At Deel, this week is…</span>
      ${w.deelIntro?`<p>${w.deelIntro}</p>`:""}
      <ul>${w.deel.map(x=>`<li>${x}</li>`).join("")}</ul>
    </div>
    <p class="note"><strong style="color:var(--ink);font-weight:600">Cut if behind:</strong> ${w.cut}</p>
  </section>

  <section class="block">
    <blockquote>"${w.quote}"</blockquote>
  </section>`;
}

function pager(i){
  const prev = i>0 ? WEEKS[i-1] : null, next = i<WEEKS.length-1 ? WEEKS[i+1] : null;
  return `<nav class="pager">
    ${prev?`<a href="#${prev.id}"><small>← Week ${prev.n}</small><span>${weekName(prev)}</span></a>`:`<a href="#overview"><small>← Back</small><span>Overview</span></a>`}
    ${next?`<a class="next" href="#${next.id}"><small>Week ${next.n} →</small><span>${weekName(next)}</span></a>`:`<a class="next" href="#overview"><small>Back →</small><span>Overview</span></a>`}
  </nav>`;
}

function render(){
  const id = (location.hash||"").replace("#","");
  const i = WEEKS.findIndex(w=>w.id===id);
  const app = document.getElementById("app"), crumb=document.getElementById("crumb");
  if(i<0){ app.innerHTML=overview(); crumb.textContent="Overview"; }
  else { const w=WEEKS[i]; app.innerHTML=weekPage(w)+pager(i); crumb.textContent=`Week ${w.n} · ${weekName(w)}`; }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
</script>

</body>
</html>
