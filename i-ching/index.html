h over Wind","judgment":"Pushing upward brings success from the ground up. Go see the person who can open the way, and stop being afraid of the climb.","image":"Wood grows up through packed earth, so you pile up small efforts until they add to something tall.","theme":"You are rising slowly through resistance, and the rise is real even when nothing looks different yet.","advice":"Take the next step, then the one after, and do not skip stages to arrive sooner. Adapt around what is hard the way a root does.","moods":["rising","discipline"],"keys":["growth","effort","patience"],"imagery":["wood growing inside the earth","roots working through packed clay","steps cut into a hillside","sapling clearing the fence line","empty city with open gates","climbing after the light goes"],"art":[1,1,1,1,1,1],"verbs":["climb","grow","press","stack","persist"],"lines":["You start upward and people believe in you, so this first push costs almost nothing.","You are rough next to the company you are entering, but real sincerity makes a small gift enough.","You rise into an empty town with no resistance, so enjoy it but do not trust it.","You are offered the mountain and the honor is genuine, so take it without hesitating.","You climb one step at a time and skip nothing, and that is exactly why you arrive.","You keep pushing upward in the dark, and only unbroken, careful effort keeps this from failing."]},{"n":47,"name":"Kun","en":"Oppression","sym":"䷮","bits":"010110","tri":"Lake over Water","judgment":"You are worn down and hemmed in, and there is still a way through. Whatever you say now will not be believed, so let the work speak.","image":"The lake has drained and lies empty, so you stake your whole life on the thing you actually mean.","theme":"You are exhausted, unheard, and short of everything, and this is the season that shows what you are made of.","advice":"Stop arguing your case and stop scattering the little energy you have. Hold your purpose, wait out the drought, and keep your bitterness from becoming your character.","moods":["blocked","loss","danger"],"keys":["exhaustion","silence","endurance"],"imagery":["lake drained down to mud","bare tree with no water","thorns under your palm","gloomy valley for three years","golden carriage moving too slow","creeping vines around your ankles"],"art":[1,1,0,1,1,0],"verbs":["endure","thirst","hold","speak","last"],"lines":["You sit under a bare tree in a dark valley and see nothing at all for a long time.","You are worn out with food in front of you, and help arrives if you stay where you are.","You lean on thorns and push against stone, come home, and find your house empty.","You come slowly in a golden carriage, ashamed of the delay, and you still get there.","You are cut at the top and the bottom, and relief comes softly rather than all at once.","Vines hold your ankles and you say moving hurts, so regret that, move anyway, and it opens."]},{"n":48,"name":"Jing","en":"The Well","sym":"䷯","bits":"011010","tri":"Water over Wind","judgment":"Towns move but the well stays. It never runs low and never overflows. Lower the rope all the way, and do not break the jug at the last moment.","image":"Water is drawn up through wood, so you encourage people in their work and get them helping one another.","theme":"There is a deep, steady source underneath your situation, and everything depends on whether you can reach it.","advice":"Go all the way down rather than halfway. Clean out what has silted up in you, and make what you have available to whoever comes for it.","moods":["union","waiting","abundance"],"keys":["source","depth","service"],"imagery":["cold spring in the well","rope a foot short","broken jug at the wellhole","mud at the bottom","stone lining set in place","town moved, well left standing"],"art":[1,1,1,0,1,1],"verbs":["draw","share","clean","reach","sustain"],"lines":["You drink the mud instead of the water, and even the animals stop coming to you.","You use the well to shoot fish, and the jug leaks out everything you meant to keep.","You are cleaned out and ready and nobody drinks, and the waste of it is real grief.","You stop giving and line the walls instead, and this repair season takes nothing away from you.","The spring runs clear and cold in you, and people can drink from it now.","You are drawn from freely all day long, you stay dependable, and you do not run out."]},{"n":49,"name":"Ge","en":"Revolution","sym":"䷰","bits":"101110","tri":"Lake over Fire","judgment":"Revolution is believed only when its own day arrives. When the change is genuinely needed, regret disappears and the way opens.","image":"Fire burns inside the lake, two things that cannot share a room, so you redraw the calendar and name the seasons again.","theme":"An arrangement you have been living inside has stopped working, and the old skin has to come off.","advice":"Wait until the need for change is obvious to others and not only to you. Then act cleanly, explain yourself once, and do not go back.","moods":["turning","release"],"keys":["revolution","timing","shedding"],"imagery":["fire inside the lake","yellow cowhide bound tight","tiger's new stripes","panther's changing coat","old skin coming off","seasons named again"],"art":[0,1,1,1,1,1],"verbs":["shed","change","overturn","renew","break"],"lines":["Bound in tough hide, you hold still, because the hour for overturning anything has not come.","When your own day finally arrives you move, and the break you make brings no blame.","Acting now brings ruin, so let the talk circle three times before you commit to the change.","Regret falls away as people begin to believe you, and remaking the whole arrangement turns out well.","You change like a tiger, stripes unmistakable, and people trust the new pattern before you explain it.","You change like a panther in small ways while others only rearrange their faces, so stop pushing."]},{"n":50,"name":"Ding","en":"The Cauldron","sym":"䷱","bits":"011101","tri":"Fire over Wind","judgment":"The cauldron turns raw material into a meal worth offering. Supreme good fortune, and the work succeeds.","image":"Fire rises through wood beneath a bronze pot, so you make your position correct and let your life take its proper shape.","theme":"You are being asked to make something nourishing out of raw material, in service of more than yourself.","advice":"Set the vessel level before you fill it. Treat the work as an offering rather than a possession, and let the right people eat from it.","moods":["abundance","union"],"keys":["nourishment","vessel","service"],"imagery":["bronze pot steaming","fire under green wood","yellow handles and gold rings","rings of jade","spilled prince's meal","pheasant fat gone cold"],"art":[1,0,0,0,1,1],"verbs":["cook","hold","feed","transform","offer"],"lines":["You tip the pot over to clear out old residue, and even a low beginning proves useful.","You have real food in your pot, and though others envy it, they cannot touch you.","Your handles are wrong so nobody lifts you, and the best of the meal sits uneaten until rain.","A leg snaps under the weight you took on, the meal spills, and the disgrace is yours.","Yellow handles and gold carrying rings make you easy to lift, so stay modest and stay firm.","Rings of jade join hardness to softness, and everything you undertake from here goes well."]},{"n":51,"name":"Zhen","en":"The Arousing","sym":"䷲","bits":"100100","tri":"Thunder over Thunder","judgment":"Shock arrives and success follows it. Thunder rolls for a hundred miles and you do not spill the wine you are carrying.","image":"Thunder rolls over thunder, so you set your life in order and look hard at what the noise exposed.","theme":"Something sudden has cracked the surface of your life, and the fear it brings is doing useful work.","advice":"Let the jolt wake you rather than scatter you. Keep your hands steady, take the fear as instruction, and repair what it just showed you.","moods":["danger","turning"],"keys":["shock","awakening","nerve"],"imagery":["thunder on thunder","spoon that never falls","wine unspilled in the cup","nine hills to climb","mud around the ankles","lightning on the neighbor's roof"],"art":[0,1,1,0,0,0],"verbs":["shake","wake","startle","steady","examine"],"lines":["The shock lands and frightens you, and afterward you are laughing, because the fear did its job.","Danger comes and you lose what you held, so climb clear and let it return on its own.","The shock leaves you rattled, but if it moves you to act you take no harm.","The shock sinks into mud and you sink with it, stuck where nothing can strike or lift you.","Danger comes and goes and comes again, yet nothing is truly lost and there is work waiting.","You stare around in ruin and terror, so do not go forward, and be glad it struck your neighbor first."]},{"n":52,"name":"Gen","en":"Keeping Still","sym":"䷳","bits":"001001","tri":"Mountain over Mountain","judgment":"Stillness held in the back until the body quiets, so that you stand in your own yard and see no one. No blame.","image":"Mountains stand shoulder to shoulder without moving, so you keep your thoughts from wandering past your situation.","theme":"This is a moment for stopping completely rather than making one more small push.","advice":"Stop while stopping is still easy. Quiet the body first and the mind follows, and say nothing you have not weighed.","moods":["retreat","discipline"],"keys":["stillness","limit","quiet"],"imagery":["mountain against mountain","empty courtyard at noon","toes that do not move","jaw held shut","snow on a still ridge","stiffened spine"],"art":[1,1,0,1,0,1],"verbs":["stop","settle","hold","quiet","rest"],"lines":["You stop at the toes, before the first step commits you, and nothing is lost.","Your legs stop but the one you follow keeps going, and your heart is not glad.","You force the stillness at the waist and stiffen your spine, and the held breath suffocates you.","You bring the whole trunk to rest, your own self and nobody else's, and take no blame.","You still your jaw, so your words come in order and the regret goes out of them.","Your stillness is generous and complete now rather than a clenching, and good comes from it."]},{"n":53,"name":"Jian","en":"Development","sym":"䷴","bits":"001011","tri":"Wind over Mountain","judgment":"Progress comes the way a marriage is properly arranged, in stages and in order. Hold the course and it goes well.","image":"A tree grows on the mountain, slow and wind-shaped, so you build character until your presence improves the people near you.","theme":"What you want is coming, but only at the speed of growing things.","advice":"Take the next stage and no more. Let each step set before you place the next, and refuse every shortcut offered to you.","moods":["rising","waiting"],"keys":["patience","growth","steadiness"],"imagery":["wild geese on the shore","flat branch found","tree on the mountain","feathers for the dance","bare plateau","cloud heights"],"art":[1,1,1,0,1,0],"verbs":["grow","root","advance","wait","climb"],"lines":["You reach the shore young and exposed, and there is talk about you, but you are blameless.","You reach the flat rock where there is food and company, and you eat in peace.","You stray onto the bare plateau where things start and never finish, so guard what is yours.","You land in a tree with no good perch, but one flat branch holds you well enough.","You reach the summit and for three years nothing comes, yet in the end nothing can stop you.","You reach the cloud heights, and even the feathers you drop become something people dance with."]},{"n":54,"name":"Gui Mei","en":"The Marrying Maiden","sym":"䷵","bits":"110100","tri":"Thunder over Lake","judgment":"You enter on someone else's terms, into a place with no clear standing. Pushing forward from here goes badly.","image":"Thunder stirs above the lake, so you look at what will not last and understand it by how it ends.","theme":"You hold the weaker position in a relationship or arrangement whose rules you did not set.","advice":"Do not seize a rank you were not given. Keep your affection honest, accept the smaller place for now, and start nothing large.","moods":["blocked","loss","waiting"],"keys":["modesty","limits","tact"],"imagery":["thunder over the lake","empty wicker basket","sheep that won't bleed","moon nearly full","plainer sleeves than the maid's","lame foot walking"],"art":[0,1,1,1,0,1],"verbs":["enter","yield","defer","endure","accept"],"lines":["You come in as the secondary figure, and like a lame foot that still walks, you go on.","You see clearly with one eye in a dim arrangement, so keep faith quietly and alone.","You reach for a place above you and land lower, taken on terms you would not choose.","You let the date pass and stay unchosen, because the right joining is late rather than lost.","You dress plainer than your servant and carry more, and like the almost full moon this suits you.","You hold a basket with no fruit and cut a sheep that does not bleed, and the rite is hollow."]},{"n":55,"name":"Feng","en":"Abundance","sym":"䷶","bits":"101100","tri":"Thunder over Fire","judgment":"Fullness arrives and succeeds. Do not grieve that it will pass. Be the sun at noon while it is noon.","image":"Thunder and lightning arrive together, so you make clear decisions and carry out what you decide.","theme":"You are at the top of an arc, bright and full, and the light has already begun to tilt.","advice":"Use the peak now rather than later. Make the decisions that need full light, and stop measuring the fall while you still have the day.","moods":["abundance","turning"],"keys":["fullness","clarity","peak"],"imagery":["sun at high noon","stars visible at midday","curtain drawn too thick","thunder and lightning together","broken right arm","gate with nobody left"],"art":[1,1,1,0,1,1],"verbs":["fill","shine","peak","decide","gather"],"lines":["You meet someone whose aim matches yours, and ten days together in that work brings no fault.","You sit behind a curtain so thick that stars show at noon, so speak plainly through the mistrust.","You are so shaded by overgrowth that you see faint stars at noon and lose your right arm.","You are still in the noon darkness, but you meet an equal there, and things begin moving.","You draw good people toward you, and blessing and reputation arrive at the same time.","You build a grand house and screen everyone out, and three years later the gate stays empty."]},{"n":56,"name":"Lu","en":"The Wanderer","sym":"䷷","bits":"001101","tri":"Fire over Mountain","judgment":"The traveler succeeds in small things. Stay steady, keep your dignity small and intact, and the road treats you well.","image":"Fire moves across the mountain and never settles, so you judge clearly, punish carefully, and let nothing drag on.","theme":"You are passing through territory that is not yours, without the standing you would have at home.","advice":"Travel light and keep your manners. Do not stoop to petty business or make enemies of your hosts, because you are a guest here and not the owner.","moods":["retreat","loss"],"keys":["passage","caution","exile"],"imagery":["fire crossing the mountain","inn burning down","bird's nest in flames","ax in the pack","pheasant down first arrow","bed for one night"],"art":[1,1,1,1,1,1],"verbs":["travel","carry","lodge","watch","move"],"lines":["You fuss over small mean things in a strange place, and you bring the trouble on yourself.","You reach an inn with your belongings intact and earn the loyalty of a young helper.","You burn down your own lodging and lose that helper's loyalty, and now you stand exposed.","You find shelter and money and an ax for protection, and still your heart is not easy.","You bring down the pheasant with one arrow, and the skill earns you both praise and a place.","Your nest burns while you are still laughing, and by the time you weep the cow is gone."]},{"n":57,"name":"Xun","en":"The Gentle","sym":"䷸","bits":"011011","tri":"Wind over Wind","judgment":"Gentleness succeeds through small continuous pressure. Have a direction, and find someone who can see further than you.","image":"Wind follows wind across the land, so you repeat your instruction until it takes and then carry the work through.","theme":"You cannot force this, but steady influence applied in one direction will get all the way in.","advice":"Say the thing more than once, in the same direction, without raising your voice. Choose one aim and let repetition do what force cannot.","moods":["discipline","waiting"],"keys":["influence","persistence","gentleness"],"imagery":["wind following wind","roots under the floorboards","dust under the door","three days before the change","three kinds of game","ax gone missing"],"art":[0,0,0,0,0,1],"verbs":["enter","bend","spread","repeat","soften"],"lines":["You waver forward and back, so borrow a soldier's discipline and let it settle your direction.","You reach under the bed where the hidden fear lives, and you bring in help to clear it.","You keep circling the same thought without ever entering it, and the repetition becomes embarrassing.","You end the regret, and your hunt brings back three kinds of game, enough for every use.","You start badly and finish well, so watch three days before the change and three days after.","You search under the bed until nothing is left, and you lose your property and your ax."]},{"n":58,"name":"Dui","en":"The Joyous","sym":"䷹","bits":"110110","tri":"Lake over Lake","judgment":"Joy succeeds. Keep it honest and keep it steady, and it lasts.","image":"Two lakes lie open to each other and feed each other, so you meet with friends to talk things through and practice.","theme":"There is real pleasure available here, in company and in open exchange.","advice":"Let the joy be genuine and shared rather than performed or bought. Talk things through with people you trust, and refuse flattery from anyone.","moods":["joy","union","release"],"keys":["joy","openness","exchange"],"imagery":["two lakes touching","open water","friends talking late","mouth full of laughter","still water giving back light","shine on the surface"],"art":[0,0,1,1,0,1],"verbs":["open","share","laugh","speak","join"],"lines":["Your gladness asks for nothing and compares itself to nothing, and it comes out well.","You are glad from the inside, and that sincerity dissolves whatever regret you were carrying.","You go out chasing amusement to fill yourself, and the hunger turns back on you.","You weigh two pleasures against each other and rest in neither until you drop the lesser one.","You open your trust to something already rotting, and the honesty itself becomes the danger.","You are drawn along by a charming surface, led somewhere you never actually decided to go."]},{"n":59,"name":"Huan","en":"Dispersion","sym":"䷺","bits":"010011","tri":"Wind over Water","judgment":"What was hard dissolves and success follows. The crossing is worth making, and steadiness holds through it.","image":"Wind moves over water and breaks the surface apart, so you build something people can gather around and honor what is larger than you.","theme":"A rigidity is breaking up, in you or between people, and the melting is the cure rather than the illness.","advice":"Let the frozen thing loosen instead of defending it. Give people something worth gathering around, and let your own pride dissolve first.","moods":["release","union","turning"],"keys":["release","gathering","flow"],"imagery":["wind across open water","ice breaking into pieces","horse at the ford","fever breaking into sweat","temple across the water","knot coming loose"],"art":[0,1,1,1,1,1],"verbs":["dissolve","scatter","loosen","cross","gather"],"lines":["You help early while the split is still small, moving with a horse's strength, and it holds.","When things scatter, you run to what actually supports you rather than to what you are used to.","You dissolve your own self-regard, and with that ego gone there is nothing left to regret.","You break up your own faction, and the wider gathering that follows is more than most imagine.","You call out one clear idea that breaks the fever like sweat, and the center holds.","You get the blood out of the situation and go, keeping your distance, and no harm follows."]},{"n":60,"name":"Jie","en":"Limitation","sym":"䷻","bits":"110010","tri":"Water over Lake","judgment":"Limits are what make things work. But a limit that galls cannot be kept, so do not force yourself to keep it.","image":"The lake holds only so much water, so you create measure and number and look hard at what conduct is right.","theme":"Your energy is finite and it needs banks, or it spreads thin and evaporates.","advice":"Set the limit yourself before circumstance sets it for you. Make it strict enough to matter and humane enough to actually keep.","moods":["discipline","blocked"],"keys":["measure","discipline","boundaries"],"imagery":["water inside the lake","joint of bamboo","notches on a measuring rod","shut courtyard gate","banks that hold the flood","cup filled level"],"art":[0,1,0,1,0,1],"verbs":["measure","limit","count","hold","stop"],"lines":["You stay inside your own door while the way out is closed, and nothing is lost.","You stay behind the gate while the gate stands open, and the missed hour costs you.","You keep no limit at all, and there is nobody but yourself left to complain to.","You accept the limit calmly, fit yourself to your actual means, and things move easily again.","You limit yourself in a way that is sweet rather than harsh, and others follow you gladly.","You hold a limit that has turned cruel, and clinging to it harms you more than letting go."]},{"n":61,"name":"Zhong Fu","en":"Inner Truth","sym":"䷼","bits":"110011","tri":"Wind over Lake","judgment":"Inner truth reaches even the stubborn and the dull. The crossing is worth making, and steadiness holds.","image":"Wind moves over the lake and stirs it from within, so you weigh people's cases slowly and hold off on punishment.","theme":"What you can accomplish here depends entirely on whether you are actually sincere.","advice":"Empty out your prejudices before you speak. Say the true thing quietly, and trust that what is genuine in you calls out what is genuine in others.","moods":["union","joy"],"keys":["trust","resonance","sincerity"],"imagery":["crane calling in shade","young bird answering","goblet passed across","moon just before full","drum starting and stopping","rooster crowing at heaven"],"art":[1,1,1,1,1,1],"verbs":["trust","listen","answer","sound","hold"],"lines":["You stay inwardly prepared and unattached, and the moment you start scheming the ground gets unsteady.","A crane calls in the shade and its young answers, and what is true in you draws its answer.","You hang your whole mood on another person, so you drum then stop, sob then sing.","Like the moon just before full, you leave your old team behind and face the light directly.","Your truth holds people together like a knot pulled tight, and nobody comes loose.","You crow toward heaven with sound and nothing behind it, and pressing on brings harm."]},{"n":62,"name":"Xiao Guo","en":"Preponderance of the Small","sym":"䷽","bits":"001100","tri":"Thunder over Mountain","judgment":"Small things succeed now and great ones do not. The bird's call says fly low, not high, and staying low goes well.","image":"Thunder cracks on the mountaintop, loud but carrying no distance, so you give extra weight to respect, to grief, and to thrift.","theme":"This is a season for small correct actions, and any large ambition will overshoot.","advice":"Do the modest thing thoroughly instead of the grand thing badly. Attend to detail, tone, and cost, and stay lower than you think you should.","moods":["retreat","waiting","discipline"],"keys":["smallness","care","humility"],"imagery":["thunder on the mountaintop","bird flying too high","thick clouds and no rain","low nest in grass","shadow at your back","arrow into the cave"],"art":[0,1,0,1,1,1],"verbs":["stoop","tend","guard","keep","lower"],"lines":["You fly up when you should have stayed in the nest, and the height is what kills you.","You aim past your superior and meet the lesser official instead, and settling for that is fine.","You walk on without caution, certain you are safe, and someone strikes you from behind.","You meet what comes without overshooting it, so stay on guard, make no move, and hold.","The clouds are thick with no rain, so you take one careful shot at what hides below.","You overshoot the meeting entirely and the bird flies out of reach, and the miss injures you."]},{"n":63,"name":"Ji Ji","en":"After Completion","sym":"䷾","bits":"101010","tri":"Water over Fire","judgment":"It is finished and only small matters remain. Good at the start, disorder at the end, so hold your form.","image":"Water sits over fire, each in its right place and each able to ruin the other, so you think ahead about what could go wrong.","theme":"You have arrived, and the danger now is not failure but drift.","advice":"Do not relax into the finished thing. Keep the small maintenance going, expect the decline before it starts, and stay awake at the top.","moods":["abundance","danger","turning"],"keys":["completion","vigilance","upkeep"],"imagery":["water above the fire","wheel held back","tail dragged in water","carriage curtain gone","fine silk fraying","small offering westward"],"art":[0,1,1,1,1,1],"verbs":["finish","guard","maintain","brake","watch"],"lines":["You brake the wheels and wet only the tail, slowing at the start so the crossing holds.","You lose the curtain from your carriage, so do not chase it, because it comes back on its own.","You spend three hard years subduing what resists you, so do not hand the peace to small people.","The finest clothes are already fraying at the seam, so stay alert through the whole day.","You give a small honest offering while your neighbor kills an ox, and yours is worth more.","You go in past your depth and the water closes over your head, and that is the danger."]},{"n":64,"name":"Wei Ji","en":"Before Completion","sym":"䷿","bits":"010101","tri":"Fire over Water","judgment":"Before completion, success is still possible. But if the fox nearly across gets its tail wet, nothing goes forward.","image":"Fire rises above water that sinks away beneath it, so you sort things carefully until each one finds its place.","theme":"You are near the end of a long transition, and the last stretch is where care matters most.","advice":"Do not celebrate early and do not rush the last step. Separate what belongs where, keep your footing, and finish the crossing dry.","moods":["waiting","rising","danger"],"keys":["threshold","caution","order"],"imagery":["fox with a wet tail","river still uncrossed","fire above the water","wheels held at the bank","wine before the work's done","far bank in sight"],"art":[1,1,0,1,0,1],"verbs":["cross","prepare","sort","near","wait"],"lines":["You push into the water too soon and get your tail wet, and it is humiliating.","You hold the wheels back instead of charging ahead, and that restraint is what carries you.","The crossing is not finished, so attacking now goes badly, though the crossing itself is right.","You commit fully and hold the line for three years, and the long discipline is finally rewarded.","Your light is genuine now, without doubt and without display, and people come toward it.","You drink with real confidence at the end, but soak your head and you lose everything."]}];

  var v1 = take(g.couplets, phases[0], moods, st.verse, used, rnd);

  if (v1.length < st.verse) v1 = v1.concat(take(g.couplets, null, moods, st.verse - v1.length, used, rnd));
  if (v2.length < st.verse) v2 = v2.concat(take(g.couplets, null, moods, st.verse - v2.length, used, rnd));

  var hookLines = hook.lines.map(f.fill);
  var sections = [];
  function versify(cs) { var out = []; cs.forEach(function (c) { c.lines.forEach(function (l) { out.push(f.fill(l)); }); }); return out; }
  sections.push({ label: st.labels[0], lines: versify(v1) });
  sections.push({ label: st.labels[1], lines: hookLines });
  sections.push({ label: st.labels[2], lines: versify(v2) });
  sections.push({ label: st.labels[3], lines: hookLines });
  sections.push({ label: st.labels[4], lines: bridge.lines.map(f.fill) });
  sections.push({ label: st.labels[5], lines: hookLines });

  return {
    title: titleFor(g, hex, rnd, usedTitles),
    subtitle: subtitle,
    tempo: g.tempo,
    musKey: pick(rnd, KEYS_MUS),
    sections: sections
  };
}

function buildSongs(g, r, terms) {
  var rnd = mulberry32(r.seed ^ 0x9E3779B9);
  var used = {}, usedTitles = {};
  var mNow = r.now.moods || ['any'], mThen = r.then.moods || ['any'];
  var mMid = mNow.concat(mThen);
  var changed = r.changing.length > 0;
  var songs = [];
  songs.push(buildSong(g, r.now, mNow, ['open', 'tension'], terms, rnd, used, usedTitles,
    'Side A — where you actually are. ' + r.now.en + '.'));
  songs.push(buildSong(g, changed ? r.now : r.now, mMid, ['tension', 'turn'], terms, rnd, used, usedTitles,
    changed ? 'Side B — the lines that are moving.' : 'Side B — the part that will not move yet.'));
  songs.push(buildSong(g, r.then, mThen, ['turn', 'resolve'], terms, rnd, used, usedTitles,
    changed ? 'Side C — where it is heading. ' + r.then.en + '.' : 'Side C — what holding steady gets you.'));
  var usedKeys = {};
  songs.forEach(function (s) {
    var guard = 0;
    while (usedKeys[s.musKey] && guard++ < 40) s.musKey = pick(rnd, KEYS_MUS);
    usedKeys[s.musKey] = 1;
  });
  return songs;
}

var audioCfg = { provider: 'minimax', key: '', base: 'https://queue.fal.run', voice: 'any' };

var PROVIDERS = {
  minimax: {
    label: 'MiniMax Music',
    model: 'fal-ai/minimax-music/v2.6',
    note: 'sings your lyrics, up to 5 min, ~$0.15 a track',
    body: function (song, g, hex) {
      return { prompt: stylePrompt(song, g, hex).slice(0, 1990), lyrics: apiLyrics(song).slice(0, 3400), is_instrumental: false };
    }
  },
  acestep: {
    label: 'ACE-Step',
    model: 'fal-ai/ace-step',
    note: 'open model, ~20s per track, cheapest, rougher vocals',
    body: function (song, g, hex) {
      return { tags: styleTags(song, g, hex), lyrics: apiLyrics(song).slice(0, 3400), duration: 150 };
    }
  }
};

var MOODWORD = {
  rising: 'building, hopeful', blocked: 'stuck, heavy', waiting: 'patient, suspended',
  danger: 'tense, uneasy', joy: 'bright, open', release: 'unclenching, relieved',
  discipline: 'steady, deliberate', union: 'warm, together', loss: 'grieving, spare',
  turning: 'pivoting, restless', retreat: 'withdrawn, quiet', abundance: 'full, glowing'
};
function moodText(hex) {
  return (hex.moods || []).map(function (m) { return MOODWORD[m] || m; }).join(', ');
}
function voiceText() {
  return audioCfg.voice === 'female' ? 'female lead vocal' : audioCfg.voice === 'male' ? 'male lead vocal' : 'lead vocal';
}
function stylePrompt(song, g, hex) {
  return g.tempo + ', in the key of ' + song.musKey + ', ' + voiceText()
    + ', ' + moodText(hex) + '. A song about ' + hex.en.toLowerCase() + ' — ' + hex.theme;
}
function styleTags(song, g, hex) {
  return [g.label.toLowerCase(), g.tempo, song.musKey, voiceText(), moodText(hex)].join(', ');
}
var SECMAP = { 'VERSE 1': 'Verse', 'VERSE 2': 'Verse', 'HOOK': 'Chorus', 'CHORUS': 'Chorus', 'BRIDGE': 'Bridge' };
function apiLyrics(song) {
  return song.sections.map(function (s) {
    return '[' + (SECMAP[s.label] || 'Verse') + ']\n' + s.lines.join('\n');
  }).join('\n\n');
}

function authHeaders(scheme) {
  var k = audioCfg.key.trim();
  if (/^(Key|Bearer)\s/i.test(k)) return { Authorization: k, 'Content-Type': 'application/json' };
  return { Authorization: scheme + ' ' + k, 'Content-Type': 'application/json' };
}

function falPost(url, body, scheme) {
  return fetch(url, { method: 'POST', headers: authHeaders(scheme), body: JSON.stringify(body) })
    .then(function (res) {
      if (res.status === 401 && scheme === 'Key') return falPost(url, body, 'Bearer');
      return res.json().then(function (j) {
        if (!res.ok) throw new Error((j && (j.detail || j.error || j.message)) ? JSON.stringify(j.detail || j.error || j.message) : 'HTTP ' + res.status);
        return j;
      });
    });
}
function falGet(url) {
  return fetch(url, { headers: authHeaders('Key') }).then(function (res) { return res.json(); });
}

function generateAudio(song, g, hex, onState) {
  var p = PROVIDERS[audioCfg.provider];
  if (!audioCfg.key.trim()) return Promise.reject(new Error('NO API KEY SET — ADD ONE ABOVE.'));
  var submitUrl = audioCfg.base.replace(/\/+$/, '') + '/' + p.model;
  onState('Sending lyrics to ' + p.label);
  return falPost(submitUrl, p.body(song, g, hex), 'Key').then(function (j) {
    var statusUrl = j.status_url || (submitUrl + '/requests/' + j.request_id + '/status');
    var resultUrl = j.response_url || (submitUrl + '/requests/' + j.request_id);
    var tries = 0;
    return new Promise(function (resolve, reject) {
      (function poll() {
        if (tries++ > 120) return reject(new Error('TIMED OUT AFTER 6 MINUTES.'));
        falGet(statusUrl).then(function (s) {
          var st = s.status || '';
          if (st === 'COMPLETED') {
            onState('Fetching the track');
            return falGet(resultUrl).then(function (r) {
              var url = r && r.audio && (r.audio.url || r.audio);
              if (!url) return reject(new Error('NO AUDIO IN RESPONSE.'));
              resolve(url);
            });
          }
          if (st === 'FAILED' || s.detail && !st) return reject(new Error('GENERATION FAILED.'));
          onState((st === 'IN_PROGRESS' ? 'Rendering audio' : 'Queued') + ' · ' + (tries * 3) + 's');
          setTimeout(poll, 3000);
        }).catch(reject);
      })();
    });
  });
}

function sunoBlock(song, g, hex) {
  return 'STYLE\n' + stylePrompt(song, g, hex) + '\n\nTITLE\n' + song.title + '\n\nLYRICS\n' + apiLyrics(song);
}

/* ---------- clipboard ---------- */
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 1700);
}
function copy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, function () { fallbackCopy(text); });
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea'); ta.value = text;
  ta.style.cssText = 'position:fixed;top:-1000px'; document.body.appendChild(ta);
  ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Copy failed'); }
  document.body.removeChild(ta);
}
function download(name, text) {
  try {
    var b = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    toast('Saved');
  } catch (e) {
    copy(text); toast('Download blocked, copied instead');
  }
}

  host.appendChild(act);

  host.appendChild(el('p', 'caption', 'Cast for ' + esc(r.birthday) + ' · The Book of Changes, 64 hexagrams'));
  host.classList.remove('hide');
}

function run(skipAnim) {
  var bday = $('#bday').value;
  var q = $('#q').value || '';
  var g = null;
  for (var i = 0; i < GENRES.length; i++) if (GENRES[i].id === state.genre) g = GENRES[i];
  var r = reading(bday, q, state.salt);
  var terms = problemTerms(q);
  var songs = buildSongs(g, r, terms);

  if (skipAnim) { renderResult(r, g, songs); window.scrollTo(0, 0); return; }

  $('#screen-form').classList.add('hide');
  $('#screen-cast').classList.remove('hide');
  window.scrollTo(0, 0);
  var box = $('#castlines'); box.innerHTML = '';
  var txt = $('#casttext');
  var msgs = ['Hold the question', 'Three coins, six times', 'Line by line', 'The lower trigram is set', 'The lines are settling', 'Reading the changes'];
  var sub = $('#castsub');
  var cols = triPair(r.now);
  setOrb(null, '#E4E6EC', '#EEF0F4');
  var i2 = 0;
  (function step() {
    if (i2 < 6) {
      txt.textContent = msgs[i2];
      box.appendChild(lineRow(r.vals[i2], 0, i2 === r.natal));
      i2++;
      sub.textContent = 'Line ' + i2 + ' of 6';
      if (i2 === 3) setOrb(null, null, cols[1]);
      if (i2 === 6) setOrb(null, cols[0], null);
      setTimeout(step, 620);
    } else {
      txt.textContent = 'Writing your songs';
      sub.textContent = r.now.en;
      setTimeout(function () {
        $('#screen-cast').classList.add('hide');
        renderResult(r, g, songs);
        window.scrollTo(0, 0);
      }, 1100);
    }
  })();
}

/* ---------- init ---------- */
function init() {
  mountBlob('blob-1', false);
  mountBlob('blob-2', true);
  var hr = new Date().getHours();
  $('#greet').textContent = hr < 5 ? 'Still awake?' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';

  var wrap = $('#genres');
  GENRES.forEach(function (g, i) {
    var b = el('button', 'chip', g.label);
    b.type = 'button';
    b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.onclick = function () {
      state.genre = g.id;
      Array.prototype.forEach.call(wrap.children, function (c) { c.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
    };
    wrap.appendChild(b);
  });
  state.genre = GENRES[0].id;

  /* plain click, not a form submit: sandboxed preview frames block form submission */
  function go(e) {
    if (e) e.preventDefault();
    var err = $('#err');
    if (!$('#bday').value) { err.textContent = 'Add your birthday. It seeds the cast.'; $('#bday').focus(); return; }
    if (!$('#q').value.trim()) { err.textContent = 'Write the thing you are actually asking.'; $('#q').focus(); return; }
    err.textContent = '';
    state.salt = 0;
    try { run(false); }
    catch (ex) { err.textContent = 'Something broke: ' + ex.message; }
  }
  $('#cast').addEventListener('click', go);
  $('#bday').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(e); });
  $('#q').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) go(e); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

/* expose for headless testing */
window.__IC = { reading: reading, buildSongs: buildSongs, problemTerms: problemTerms, songText: songText, fullText: fullText, GENRES: GENRES, HEX: HEX };
})();
</script>
</body>
