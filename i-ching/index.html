<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F8">
<title>I Ching Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400&display=swap">
<style>
:root{
  color-scheme:light;
  --page:#F3F5F8;
  --card:#FFFFFF;
  --well:#F5F6F8;
  --line:#ECEEF2;
  --ink:#1D1F24;
  --ink2:#4A4E57;
  --muted:#8D929C;
  --faint:#B8BCC4;
  --blue:#3F8CFF;
  --blue-soft:#EAF2FF;
  --greet1:#C9C3FF;
  --greet2:#9CC6FF;
  --bad:#E0524A;
  /* orb colours — replaced per reading */
  --c1:#FFC9A8;
  --c2:#FFB6CF;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --han:"Noto Serif SC","Songti SC","STSong",serif;
  --r:30px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  min-height:100vh;
  padding:28px 16px 48px;
  display:flex;justify-content:center;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv11","ss01";
}
.stage{width:100%;max-width:440px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- card ---------- */
.card{
  background:var(--card);
  border-radius:var(--r);
  padding:26px 24px 26px;
  box-shadow:0 1px 2px rgba(20,30,50,.04), 0 12px 32px rgba(20,30,50,.05);
  position:relative;
  overflow:hidden;
}
.card + .card{margin-top:14px}
.caption{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 26px}

/* ---------- top bar ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.appname{font-size:13px;font-weight:500;color:var(--ink2)}
.avatar{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--c2),var(--c1));filter:saturate(1.1)}

/* ---------- type ---------- */
.greet{
  font-weight:300;
  font-size:clamp(34px,10vw,42px);
  line-height:1.08;
  letter-spacing:-.025em;
  margin:18px 0 0;
  background:linear-gradient(95deg,var(--greet1),var(--greet2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.huge{font-weight:500;font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:0}
.mid{font-weight:500;font-size:19px;line-height:1.25;letter-spacing:-.012em;margin:0;text-wrap:balance}
.ital{font-size:15px;color:var(--muted);margin:6px 0 0}
.mono{font-size:13px;color:var(--ink2);margin:4px 0 0;font-variant-numeric:tabular-nums}
.mono.sm{font-size:12px}
.center{text-align:center}
.dim{color:var(--muted)}
.rule{height:1px;background:var(--line);margin:20px 0}
.head-c{font-size:14px;font-weight:500;text-align:center;margin:0 0 4px;color:var(--ink)}

/* ---------- orb ---------- */
.blobwrap{display:flex;justify-content:center;align-items:center;margin:22px 0 18px;height:190px}
.orb{position:relative;width:150px;height:150px;border-radius:50%;filter:blur(20px);opacity:.95;transition:opacity .6s}
.orb i{position:absolute;inset:0;border-radius:50%;transition:background 1.2s ease}
.orb i:nth-child(1){background:var(--c1);transform:translate(-14%,-6%) scale(.86)}
.orb i:nth-child(2){background:var(--c2);transform:translate(16%,10%) scale(.78);mix-blend-mode:multiply;opacity:.85}
.orb.big{width:190px;height:190px;filter:blur(26px)}
.orb.breathe{animation:breathe 3.2s ease-in-out infinite}
.orb.drift i:nth-child(1){animation:drift1 9s ease-in-out infinite}
.orb.drift i:nth-child(2){animation:drift2 11s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.92)}50%{transform:scale(1.08)}}
@keyframes drift1{0%,100%{transform:translate(-14%,-6%) scale(.86)}50%{transform:translate(-4%,6%) scale(.92)}}
@keyframes drift2{0%,100%{transform:translate(16%,10%) scale(.78)}50%{transform:translate(4%,-6%) scale(.84)}}

/* ---------- form ---------- */
label.lbl{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:0 0 8px}
.field{margin-bottom:18px}
.ask{
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:16px 16px 12px;box-shadow:0 6px 20px rgba(20,30,50,.04);
}
.ask textarea{
  width:100%;border:0;background:transparent;outline:none;resize:none;
  font:inherit;font-size:16px;color:var(--ink);min-height:84px;line-height:1.5;padding:0;
}
.ask textarea::placeholder{color:var(--faint)}
.askfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:10px}
.hint{font-size:12px;color:var(--faint)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--well);border-radius:16px;padding:6px 6px 6px 16px}
.row2 label{margin:0;color:var(--ink2);font-size:14px;font-weight:400}
input[type=date],input[type=text],input[type=password]{
  font:inherit;font-size:15px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:9px 12px;outline:none;appearance:none;-webkit-appearance:none;
}
input[type=text],input[type=password]{width:100%}
input:focus,textarea:focus{border-color:#CFE0FF}
input::placeholder{color:var(--faint)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font-size:13.5px;font-weight:500;padding:8px 15px;border:0;border-radius:10px;
  background:var(--well);color:var(--ink2);cursor:pointer;
  transition:background .15s, color .15s, transform .1s;
}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{background:var(--blue-soft);color:var(--blue)}

.btn{
  width:100%;font-size:15px;font-weight:500;padding:15px 18px;border:0;border-radius:999px;
  background:var(--ink);color:#fff;cursor:pointer;transition:transform .12s, opacity .12s;
}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--well);color:var(--ink)}
.btn.sm{font-size:13.5px;padding:11px 14px}
.btn.link{background:none;color:var(--blue);padding:6px;width:auto;font-size:13.5px}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{margin:0}
.err{font-size:13px;color:var(--bad);margin-top:10px;min-height:18px;text-align:center}

/* ---------- hexagram lines ---------- */
.castlines{display:flex;flex-direction:column-reverse;gap:9px;align-items:center;margin:4px 0;min-height:132px;justify-content:flex-start}
.hline{display:flex;gap:10px;align-items:center;opacity:0;transform:translateY(6px);animation:pop .4s ease forwards}
@keyframes pop{to{opacity:1;transform:none}}
.hbar{width:92px;height:10px;background:var(--ink);border-radius:6px;opacity:.86}
.hbar.half{width:41px}
.mk{font-size:10.5px;font-weight:500;width:34px;line-height:1;color:var(--blue)}
.mk.l{text-align:right;color:var(--muted)}
.mk .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.casttext{font-size:20px;font-weight:500;text-align:center;margin:6px 0 0;min-height:30px;letter-spacing:-.01em}
.castsub{font-size:13px;color:var(--blue);text-align:center;margin:10px 0 0;font-variant-numeric:tabular-nums}

/* ---------- result ---------- */
.hero{text-align:center}
.hero .blobwrap{height:170px;margin:10px 0 0;position:relative}
.hero .glyph{position:absolute;inset:0;display:grid;place-items:center;font-size:60px;line-height:1;color:var(--ink2);opacity:.55;font-family:var(--han);font-weight:300}
.hero .hanzi{font-family:var(--han);font-size:13px;color:var(--muted);letter-spacing:.2em}
.question{font-size:15px;color:var(--ink2);background:var(--well);border-radius:16px;padding:12px 14px;margin:18px 0 0;text-align:left}
.question::before{content:"You asked";display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}

.tabs{display:flex;gap:6px;justify-content:center;position:sticky;top:10px;z-index:5;margin:16px auto 14px;width:max-content;max-width:100%;
  background:rgba(255,255,255,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:5px;border-radius:14px;box-shadow:0 4px 18px rgba(20,30,50,.07)}
.tabs .chip{padding:7px 16px}

.hexhead{display:flex;align-items:center;gap:14px}
.hexhead .glyph{font-size:40px;line-height:1;font-family:var(--han);font-weight:300;width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:var(--well)}
.badge{display:inline-block;font-size:11.5px;font-weight:500;color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:3px 9px;margin-bottom:8px}
.kv{font-size:12px;font-weight:500;color:var(--muted);margin:22px 0 6px}
p.body{font-size:15.5px;line-height:1.62;margin:0 0 12px;color:var(--ink2)}
p.body:last-child{margin-bottom:0}
.pull{font-size:17px;line-height:1.5;color:var(--ink);font-weight:400;letter-spacing:-.005em;margin:16px 0;padding:16px 18px;border-radius:18px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 22%,#fff),color-mix(in srgb,var(--c2) 22%,#fff))}
.linelist{list-style:none;padding:0;margin:0}
.linelist li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.55;color:var(--ink2)}
.linelist li:first-child{border-top:none}
.lnum{font-size:12px;font-weight:500;padding-top:2px;white-space:nowrap;color:var(--blue)}
.arrowrow{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:12px 14px;background:var(--well);border-radius:18px}
.arrowrow .g{font-size:30px;font-family:var(--han);font-weight:300;line-height:1}
.arrowrow .a{color:var(--faint);font-size:16px}

.tracktop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.tnum{font-size:12px;font-weight:500;color:var(--blue)}
.lyrics{font-size:14.5px;line-height:1.8;margin:18px 0 4px;color:var(--ink2);padding:16px 18px;background:var(--well);border-radius:18px}
.ln{display:block;padding-left:18px;text-indent:-18px}
.sec{font-size:11.5px;font-weight:500;color:var(--muted);display:block;margin:16px 0 4px}
.sec:first-child{margin-top:0}
.note{font-size:14px;margin:6px 0 0;color:var(--muted)}

/* ---------- audio ---------- */
.state{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5}
.state.bad{color:var(--bad)}
audio{width:100%;margin-top:12px;display:block}
.mini{font-size:12.5px;line-height:1.55;color:var(--muted);margin:8px 0 0}
.mini a{color:var(--blue)}
details.adv{margin-top:10px}
details.adv summary{font-size:13px;cursor:pointer;color:var(--blue)}
details.audio summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.audio summary::-webkit-details-marker{display:none}
details.audio summary::after{content:"+";font-size:20px;font-weight:300;color:var(--muted)}
details.audio[open] summary::after{content:"–"}
details.audio[open] summary{margin-bottom:16px}
.spinner{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:7px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}

.hide{display:none !important}
.fade{animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;font-size:13px;font-weight:500;
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.24s ease;z-index:50;
}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.orb,.orb i,.hline,.fade{animation:none!important}.hline{opacity:1;transform:none}}
@media print{body{background:#fff;padding:0}.card{box-shadow:none;break-inside:avoid}.noprint,.tabs{display:none}.panel{display:block!important}}
</style>
</head>
<body>
<div class="stage">

  <!-- ================= FORM ================= -->
  <section id="screen-form">
    <div class="card">
      <div class="topbar">
        <span class="appname">I Ching Radio</span>
        <span class="avatar" aria-hidden="true"></span>
      </div>
      <h1 class="greet" id="greet">Good evening</h1>
      <p class="ital">An old book, a new song. What's on your mind?</p>

      <div class="blobwrap"><span id="blob-1"></span></div>

      <div id="form">
        <div class="field ask">
          <label class="lbl" for="q">Your question</label>
          <textarea id="q" placeholder="Say it plainly. Should I take the job in Tokyo?"></textarea>
          <div class="askfoot">
            <span class="hint">Same question, same birthday, same answer.</span>
          </div>
        </div>

        <div class="field row2">
          <label for="bday">Your birthday</label>
          <input type="date" id="bday">
        </div>

        <div class="field">
          <label class="lbl">Pick a sound</label>
          <div class="chips" id="genres"></div>
        </div>

        <button class="btn" type="button" id="cast">Cast the coins</button>
        <div class="err" id="err"></div>
      </div>
    </div>
    <p class="caption">64 hexagrams · 384 changing lines · three songs every reading</p>
  </section>

  <!-- ================= CASTING ================= -->
  <section id="screen-cast" class="hide">
    <div class="card center">
      <p class="head-c">Casting</p>
      <div class="blobwrap" style="height:230px"><span id="blob-2"></span></div>
      <p class="casttext" id="casttext"></p>
      <div class="castlines" id="castlines" style="margin-top:22px"></div>
      <p class="castsub" id="castsub"></p>
    </div>
    <p class="caption">Three coins, six times, bottom line first.</p>
  </section>

  <!-- ================= RESULT ================= -->
  <section id="screen-result" class="hide"></section>

</div>
<div class="toast" id="toast"></div>
<script>
var HEX = [{"n":1,"name":"Qian","en":"The Creative","sym":"䷀","bits":"111111","tri":"Heaven over Heaven","judgment":"Creative force is available straight from the source and it works all the way through. Stay with it and it holds.","image":"Heaven moves without stopping, so you make yourself strong and refuse to let up.","theme":"You are at a moment of pure initiating power, where the situation asks you to originate rather than respond.","advice":"Begin the thing only you can begin, and time each move to its season. Strength here means steadiness, not force.","moods":["rising","discipline"],"keys":["force","initiative","clarity"],"imagery":["six dragons at dawn","sky with no ceiling","dragon still under water","clouds passing into rain","sun climbing the ridge","horses that never tire"],"art":[0,1,1,1,1,0],"verbs":["rise","begin","drive","endure","create"],"lines":["Your power is real but not yet ripe, so you stay underwater and do not act.","You surface into the open field, visible at last, and it helps to seek out someone who sees further.","You work all day and lie awake all night with the weight of it, and stay blameless.","You hover at the edge of the leap, free to rise or stay, and either choice is clean.","You fly in open sky where your work meets the world, so find the people worth meeting.","You climb past your own limit and find only thin air and regret waiting up there."]},{"n":2,"name":"Kun","en":"The Receptive","sym":"䷁","bits":"000000","tri":"Earth over Earth","judgment":"Success comes through following rather than leading. Like a mare on open country you go far by keeping to the road.","image":"The earth is wide and devoted, so you carry the world by making yourself broad enough to hold it.","theme":"Your strength right now is responsiveness, and the work in front of you is completion rather than invention.","advice":"Let someone else set the direction and give the thing your full weight. Seek the company that shares the labor and leave the company that only wants applause.","moods":["waiting","discipline"],"keys":["yielding","support","patience"],"imagery":["hoarfrost underfoot","mare on open plain","black soil after rain","yellow silk beneath the robe","sack pulled shut tight","field that takes every seed"],"art":[1,1,0,0,1,1],"verbs":["carry","yield","hold","receive","follow"],"lines":["You feel the first frost through your shoes and know the hard season is already on its way.","You are straight, square and wide by nature, so you need no strategy for things to go right.","You keep your brilliance covered and finish the work without signing it, and that is the whole art.","You tie the sack shut and say nothing, earning neither praise nor harm in a dangerous season.","You wear your authority underneath like yellow silk, quiet at the center, and everything comes right.","You push yielding past its limit and end up fighting in the field, blood on both sides."]},{"n":3,"name":"Zhun","en":"Difficulty at the Beginning","sym":"䷂","bits":"100010","tri":"Water over Thunder","judgment":"Everything is starting at once and nothing is sorted yet. Do not launch far, set your ground and find helpers first.","image":"Clouds and thunder pile up before the rain, and you bring order out of confusion one thread at a time.","theme":"You are inside the chaos of a real beginning, where the promise is genuine but nothing has found its shape.","advice":"Do not force the situation forward. Untangle one thing, ask for help by name, and let the rest stay messy a while longer.","moods":["blocked","rising"],"keys":["chaos","beginning","tangle"],"imagery":["grass pushing through frost","tangled reins in the dark","thunder inside the rain","horse and cart pulling apart","first shoot under stone","knot in wet rope"],"art":[1,0,0,1,1,1],"verbs":["push","sprout","untangle","gather","hold"],"lines":["You stall at the threshold, and the right move is to stay put and gather helpers.","Help arrives looking like trouble, so you refuse the wrong offer and wait years for the right one.","You chase deer into the forest without a guide and lose the trail, so turn back now.","The cart has come apart, so you go toward the one who can help and ask plainly.","Your goodness cannot get through yet, so keep your efforts small, since reaching too far ends badly.","You sit still with the reins slack and the horses gone, and there is nothing but weeping."]},{"n":4,"name":"Meng","en":"Youthful Folly","sym":"䷃","bits":"010001","tri":"Mountain over Water","judgment":"Not knowing is not the problem, pretending to know is. Ask once, honestly, and take the answer you get.","image":"A spring wells up at the foot of the mountain, and you build character by following through on small things.","theme":"You are the beginner here, and the situation is teaching you something you cannot skip past.","advice":"Find someone who actually knows and ask a real question. Do not keep asking until you hear the answer you wanted.","moods":["waiting","discipline"],"keys":["inexperience","teaching","humility"],"imagery":["spring at the mountain's foot","mist on the lower slope","fetters cut from young wrists","clear water finding its channel","same question asked twice","green wood before it seasons"],"art":[1,0,1,1,1,0],"verbs":["learn","ask","teach","correct","wait"],"lines":["Discipline sets a beginner straight, but keep the restraints on too long and you break what you wanted.","You bear with the ignorant kindly and carry the household, and strength shows up as patience here.","You throw yourself at the first impressive person who passes, and lose yourself for nothing.","You are tangled in your own fantasy with nobody to correct you, and shame comes of it.","You approach it with a child's open mind, admitting you do not know, and everything opens.","You correct the fault and not the person, since punishment past prevention only makes an enemy."]},{"n":5,"name":"Xu","en":"Waiting","sym":"䷄","bits":"111010","tri":"Water over Heaven","judgment":"There is danger ahead and the crossing is not yours to force. Keep your confidence, feed yourself well, and the time will come.","image":"Clouds gather in the sky without raining, so you eat, drink and stay in good spirits while you wait.","theme":"The outcome is genuinely coming, but it is not ready, and your only real task is how you hold the interval.","advice":"Stop trying to hurry it. Keep your routines, keep yourself fed and rested, and be ready the moment the way opens.","moods":["waiting","danger"],"keys":["patience","nourishment","timing"],"imagery":["clouds stacked over the field","rain that has not fallen","waiting on wet sand","bread and wine set out","boots deep in the mud","three strangers at the door"],"art":[1,0,1,0,1,0],"verbs":["wait","eat","rest","trust","prepare"],"lines":["You wait far out in open meadow where nothing threatens yet, so keep your ordinary routine.","You wait closer in on the sand and hear people talking, but you let the gossip pass.","You push into the mud at the water's edge and pull trouble straight toward yourself.","You are in the pit and bleeding, so stop fighting and climb out any way you can.","You wait at a set table with food and wine, steady in the middle of the delay.","You fall into the hole and three uninvited guests arrive, so welcome them and it ends well."]},{"n":6,"name":"Song","en":"Conflict","sym":"䷅","bits":"010111","tri":"Heaven over Water","judgment":"You are sincere and you are being blocked. Stop halfway, find someone impartial, and do not push this to the end.","image":"Heaven and water move in opposite directions, so you think through the beginning of everything you enter.","theme":"You are in a dispute where being right is not the same as winning, and the fight itself is the danger.","advice":"Say your piece to someone fair and then stop. Withdrawing early costs you far less than the total victory you are imagining.","moods":["blocked","retreat"],"keys":["dispute","caution","retreat"],"imagery":["heaven and water pulling apart","leather belt taken back","three hundred quiet houses","door you walk back through","cold face across the table","contract read twice"],"art":[0,1,0,1,1,1],"verbs":["argue","yield","withdraw","weigh","settle"],"lines":["You let the quarrel drop early, take a little talk about it, and come out fine.","You cannot win this one, so you go home and let it go, sparing everyone around you.","You live on what you have already earned and stay out of the fight, and the danger passes.","You turn back from the fight, change your mind, and find peace in what is actually yours.","You bring it before someone genuinely impartial, and the judgment lands in your favor.","You win the belt and lose it three times before noon, since victory this way never holds."]},{"n":7,"name":"Shi","en":"The Army","sym":"䷆","bits":"010000","tri":"Earth over Water","judgment":"Collective force only works under discipline and a leader people actually trust. Without that it turns back on you.","image":"Groundwater collects unseen beneath the earth, so you build strength by taking care of the people around you.","theme":"You are organizing something that requires real command, where order matters more than enthusiasm.","advice":"Set the structure before the first move and put the most experienced person in charge. Share the hardship instead of directing from a distance.","moods":["discipline","danger"],"keys":["order","leadership","discipline"],"imagery":["water hidden in the earth","column moving in order","corpses in the wagon","three honors from the king","cold camp before dawn","one voice over many"],"art":[1,1,0,0,1,0],"verbs":["lead","order","march","discipline","retreat"],"lines":["You set out in proper order from the first step, because sloppy beginnings here end in disaster.","You stand in the middle of your people, sharing the risk, and honor comes back to you.","The wrong person is giving orders and you are hauling the dead, and this goes badly.","You pull back to better ground without shame, since retreat in good order is not defeat.","The trouble is out in the open now, so let the experienced one lead and keep amateurs out.","The work is done and the rewards go out, so choose very carefully who you raise up."]},{"n":8,"name":"Bi","en":"Holding Together","sym":"䷇","bits":"000010","tri":"Water over Earth","judgment":"There is good fortune in coming together. Look honestly at whether you belong here, and if you do, commit early.","image":"Water lies close on the earth with no gap between them, so you build real relationships instead of managing them.","theme":"Your situation turns on belonging, and the question is which center you are willing to gather around.","advice":"Decide who you are actually with and say so plainly. Do not wait to see how it turns out, because latecomers get nothing.","moods":["union","rising"],"keys":["alliance","loyalty","center"],"imagery":["water soaking into ground","full earthen bowl","hunt open on one side","rivers running to one sea","lamp shared between houses","late arrival at the gate"],"art":[1,1,1,1,1,1],"verbs":["join","gather","hold","trust","belong"],"lines":["You come in honest and plain like a full clay bowl, and unexpected good arrives from outside.","You join from the inside out, keeping your own dignity instead of chasing anyone's approval.","You are binding yourself to the wrong people, and the closeness costs more than the loneliness would.","You commit openly and let it be seen who you stand with, and that steadiness pays.","You leave one side of the hunt open and keep only what chooses to stay.","You arrive after everything has already formed, with no place to attach, and it goes badly."]},{"n":9,"name":"Xiao Chu","en":"The Taming Power of the Small","sym":"䷈","bits":"111011","tri":"Wind over Heaven","judgment":"Dense clouds and no rain yet. Only small measures work now, so influence gently and let the pressure build.","image":"Wind moves across the open sky, so you work on the fine details of your character while the big thing waits.","theme":"Something small is holding back something large, and you do not have the leverage for a decisive move.","advice":"Refine what is near at hand instead of forcing the outcome. Gentle, repeated pressure is the only power you have that works.","moods":["blocked","waiting"],"keys":["restraint","smallness","patience"],"imagery":["dense clouds without rain","wind across the high sky","spokes burst from the wheel","moon almost full","west field still dry","small hands on big reins"],"art":[0,0,1,1,1,0],"verbs":["restrain","gather","wait","refine","hold"],"lines":["You turn back to your own road early, before you are committed, and there is no harm.","You let yourself be pulled back along with others rather than pushing on alone, and that is right.","The spokes fly out of your wheel and you and your partner sit there blaming each other.","You stay honest in a tight spot and the fear drains away, and no blood is spilled.","You hold on with real loyalty, and your neighbor's strength becomes yours as well.","The rain finally comes and you rest, but push for more now and it turns against you."]},{"n":10,"name":"Lu","en":"Treading","sym":"䷉","bits":"110111","tri":"Heaven over Lake","judgment":"You are walking right behind something dangerous. Conduct yourself well and it will not turn on you.","image":"Heaven stands above and the lake below, so you keep your footing by knowing exactly where you stand with people.","theme":"You are moving through a situation where manner matters as much as substance and one careless step is expensive.","advice":"Go carefully and stay courteous, especially with whoever holds the power. Do not test how much you can get away with.","moods":["danger","discipline"],"keys":["conduct","care","courtesy"],"imagery":["tiger's tail underfoot","smooth road under plain shoes","tiger that does not bite","one eye on the path","narrow ledge in the rock","steps measured in the dark"],"art":[1,1,1,0,1,1],"verbs":["step","tread","mind","weigh","proceed"],"lines":["You go on plainly with no demands and no display, and the simple way stays open.","You walk a level road alone and keep to yourself, and the quiet suits you well.","You overrate what you can do, step too hard, and get bitten for the bravado.","You are right behind the danger, so you move with care and caution and come through.","You act decisively and it is correct, but know exactly how exposed this makes you.","You look back over how you walked the whole road, and it comes out well."]},{"n":11,"name":"Tai","en":"Peace","sym":"䷊","bits":"111000","tri":"Earth over Heaven","judgment":"The small goes and the great arrives. Heaven and earth are genuinely in contact, so things move easily now.","image":"Earth above and sky below, and you make the most of a good season by arranging things while they are easy.","theme":"You are in an open, fertile stretch where cooperation costs nothing and almost everything you attempt connects.","advice":"Use this while it lasts and bring your people with you. Set up what you will need later, because no flat road runs forever.","moods":["rising","union"],"keys":["harmony","exchange","prosperity"],"imagery":["ribbon grass pulled up whole","wall falling into the moat","river low enough to ford","warm ground in early spring","gate open both directions","bride sent to another house"],"art":[1,1,1,1,0,1],"verbs":["connect","flow","open","share","sustain"],"lines":["You pull one thing up and everything connected comes with it, so start now with your people.","You carry the rough ones, cross the hard water yourself, and stay fair to people far away.","Every flat stretch ends in a slope, so stay steady and enjoy what you still have.","You come down to meet your neighbors without flashing what you have, and they meet you honestly.","You give away something precious to make a real alliance, and the blessing is enormous.","The wall crumbles into the ditch, so do not fight it, just speak plainly to your own."]},{"n":12,"name":"Pi","en":"Standstill","sym":"䷋","bits":"000111","tri":"Heaven over Earth","judgment":"Heaven and earth have stopped speaking to each other. The wrong people are in charge, so do not spend yourself forcing an opening.","image":"Sky and earth pull apart, so you fall back on your own values and quietly refuse the rewards on offer.","theme":"You are in a closed season where effort does not travel and the honest response is withdrawal, not persuasion.","advice":"Stop arguing with the blockage and protect what matters to you. Keep your standards intact and wait for the pressure to shift.","moods":["blocked","retreat"],"keys":["stagnation","obstruction","withdrawal"],"imagery":["roots coming up together","sky pulling away from earth","door that will not open","mulberry shoots holding fast","letters that go unanswered","shut gate in cold weather"],"art":[1,1,1,1,0,1],"verbs":["withhold","endure","retreat","refuse","wait"],"lines":["You pull back and your people come with you, because leaving together beats staying alone.","You put up with a great deal, and refusing to compromise is exactly what keeps you whole.","You are carrying a shame you have not admitted, and pretending otherwise is what keeps it heavy.","You act on something larger than your own interest, and those who share it share the relief.","The blockage starts to give, so tie your plans down like shoots to a mulberry root.","You knock the standstill over yourself, and what was stuck turns into good fortune."]},{"n":13,"name":"Tong Ren","en":"Fellowship with Others","sym":"䷌","bits":"101111","tri":"Heaven over Fire","judgment":"People come together out in the open, not behind closed doors. A shared purpose makes even the hard crossing possible.","image":"Fire rises toward the sky, so you sort people by their kind and keep the differences clear.","theme":"Your situation depends on common cause with others, and it works only if the circle stays honest and wide.","advice":"Bring the thing into the open and say what you actually want. Do not build the alliance out of family, secrecy, or convenience.","moods":["union","joy"],"keys":["fellowship","openness","kinship"],"imagery":["fire under open sky","meeting at the front gate","weapons hidden in the brush","wall too high to climb","laughter after long crying","open meadow with no fences"],"art":[0,1,1,1,1,1],"verbs":["gather","meet","unite","share","cross"],"lines":["You meet people right at the gate, out in the open, with nothing arranged in advance.","You band together only with your own clan, and that narrow loyalty turns humiliating.","You hide weapons in the grass and watch the ridge for three years, too suspicious to move.","You climb your own wall, see the fight clearly, and choose not to attack, and good comes.","You and yours cry hard before you find each other, and then the laughing starts.","You meet in the open field beyond town, without deep ties but without regret either."]},{"n":14,"name":"Da You","en":"Possession in Great Measure","sym":"䷍","bits":"111101","tri":"Fire over Heaven","judgment":"You are holding a great deal. It keeps growing only if you keep it moving outward instead of hoarding it.","image":"Fire burns high in the sky, so you curb what is harmful and make room for what is good.","theme":"You have more than enough right now, and the whole question is what you do with the surplus.","advice":"Give some of it away and put the rest to work on something larger than yourself. Stay modest and stay awake to how fast this can change.","moods":["abundance","rising"],"keys":["abundance","generosity","responsibility"],"imagery":["fire high in the sky","big wagon loaded full","granary with open doors","harvest heavier than the cart","sun straight overhead","gold offered with both hands"],"art":[1,1,1,1,1,1],"verbs":["hold","give","sort","carry","bless"],"lines":["You keep clear of what would corrupt this and stay alert to the difficulty, so nothing goes wrong.","You have a big wagon and a strong load, so go ahead and take on more.","You put what you have at the service of something larger, which small people cannot do.","You keep your abundance distinct from your neighbor's and refuse to compete, and that restraint protects you.","You are open and easy to reach yet still hard to dismiss, and people come toward you.","Good keeps arriving from past anything you arranged, so stay grateful and keep handing it on."]},{"n":15,"name":"Qian","en":"Modesty","sym":"䷎","bits":"001000","tri":"Earth over Mountain","judgment":"Modesty carries things through to the end. Making yourself less is exactly what lets you finish what you started.","image":"The mountain sits inside the earth, so you take from where there is too much and add where there is too little.","theme":"You are in a position where lowering yourself creates real room, and any display would cost you what you have built.","advice":"Do the work and say nothing about it. Level the difference between yourself and the people around you and let the results speak.","moods":["discipline","union"],"keys":["modesty","balance","restraint"],"imagery":["mountain inside the earth","low ground that takes water","scales finding their level","full stalk bending low","quiet name in loud rooms","path worn under the hill"],"art":[1,1,1,1,1,1],"verbs":["lower","balance","carry","complete","level"],"lines":["You keep yourself small even about being small, and that lightness lets you cross hard water.","Your modesty shows itself without being announced, and holding steadily to it brings good things.","You do real work and stay quiet about it, and you get to carry it to the end.","You move through everything with a light hand, and nothing you do this way goes wrong.","You do not flaunt what you have, and when force is finally needed you can use it.","Your modesty turns inward and you discipline your own house instead of blaming outsiders."]},{"n":16,"name":"Yu","en":"Enthusiasm","sym":"䷏","bits":"000100","tri":"Thunder over Earth","judgment":"The energy is ready to move and people are ready to follow. Put helpers in place and let the movement start.","image":"Thunder rolls up out of the earth, so you make music and honor whatever you came from.","theme":"Momentum is building around you, and its worth depends entirely on whether it is aimed at anything real.","advice":"Move while people are willing and give them something concrete to do. Watch that the excitement does not become the whole point.","moods":["rising","joy"],"keys":["enthusiasm","momentum","music"],"imagery":["thunder coming out of earth","drums under the floorboards","hair clasp gathering hair","rock that will not move","music before the march","dust rising off the road"],"art":[1,0,0,1,1,1],"verbs":["move","rouse","gather","sound","begin"],"lines":["You broadcast your own excitement to anyone listening, and the noise brings misfortune down on you.","You see it turning before anyone else does and do not wait a whole day to move.","You stare upward waiting for permission and hesitate too long, and regret follows either way.","You are the source everyone gathers around, so trust it and let the friends collect.","You are chronically worn down and stuck, yet the pressure itself is what keeps you alive.","You are lost inside a delusion, and the only way out is to change once it is finished."]},{"n":17,"name":"Sui","en":"Following","sym":"䷐","bits":"100110","tri":"Lake over Thunder","judgment":"Following brings deep success when what you follow is worth it. Stay honest about the choice and no fault attaches.","image":"Thunder lies down inside the lake, so you go indoors at nightfall and let the dark do its work.","theme":"You are no longer the one setting the direction, and adapting well to what leads is the whole task.","advice":"Choose what you follow deliberately instead of drifting into it. Let the smaller loyalty go when it stands in the way of the true one.","moods":["turning","union"],"keys":["adapt","loyalty","yield"],"imagery":["thunder under still water","door closed at nightfall","small hand let go","path to the western mountain","cords wound twice around","lamp moving ahead of me"],"art":[0,1,1,1,1,1],"verbs":["follow","yield","turn","choose","rest"],"lines":["What you serve is changing, so let it change you and go out to meet others.","You cling to the easy small thing and lose the strong one worth holding onto.","You hold to the strong one and let the small comfort go, and you get what you came for.","People follow you now, and keeping them for yourself spoils it, so move in the open with clean aims.","You give yourself to something genuinely good without hedging, and that trust is repaid in full.","Your loyalty is met and doubled, and you are led up the mountain to serve something larger."]},{"n":18,"name":"Gu","en":"Work on What Has Been Spoiled","sym":"䷑","bits":"011001","tri":"Mountain over Wind","judgment":"Decay opens into great success, because ruin hands you something worth repairing. Look three days back and three days forward before you begin.","image":"Wind stalls at the foot of the mountain and things go stale, so you stir people up and give them their spirit back.","theme":"Something you inherited has been rotting quietly under your care and now the repair is yours.","advice":"Trace the damage to its source instead of patching the surface. Be firm with the old arrangement and gentle with the people still living inside it.","moods":["blocked","turning","discipline"],"keys":["repair","inheritance","rot"],"imagery":["wind dead at the mountain","worms in the bowl","father's unfinished house","mildew in the rafters","three days before dawn","old debt in a drawer"],"art":[1,0,1,1,0,1],"verbs":["repair","dig","clear","renew","tend"],"lines":["You take up your father's unfinished work, and though the risk is real it ends well.","You correct what your mother spoiled, so go gently and do not force the correction through.","You come at the old damage too hard and feel some regret, but the fault stays small.","You tolerate the rot you inherited, and every day you leave it standing deepens the shame.","You set the old failure right in a way people can see, and praise follows you.","You step out of the family business entirely and serve something higher than any court."]},{"n":19,"name":"Lin","en":"Approach","sym":"䷒","bits":"110000","tri":"Earth over Lake","judgment":"Approach brings great success while the light is still growing. Stay honest, and know the season turns against you by the eighth month.","image":"Earth stands above the lake, so you teach without running out of patience and protect without setting a limit.","theme":"Something good is moving toward you and your reach is widening, for a while.","advice":"Go toward people now, while the door is open. Use the rising time to build what will still hold when it fades.","moods":["rising","abundance","union"],"keys":["approach","influence","timing"],"imagery":["earth leaning over water","shoreline in early spring","eighth month coming","hand held out first","lake filling to the bank","open gate at morning"],"art":[1,1,1,1,1,1],"verbs":["approach","teach","widen","greet","hold"],"lines":["You come forward alongside someone strong, and holding steady in that company brings good fortune.","You advance side by side and the way keeps opening, so nothing here works against you.","You approach with easy charm and nothing comes of it, unless the letdown sobers you up.","You come the whole way to the person and meet them where they stand, and no fault attaches.","You lead by knowing which people to trust with the work, which is what real authority is.","You approach with a large heart and no calculation, and it turns out generous and right."]},{"n":20,"name":"Guan","en":"Contemplation","sym":"䷓","bits":"000011","tri":"Wind over Earth","judgment":"The hands are washed and the offering is not yet made. In that pause people look up and trust what they see.","image":"Wind moves over the earth and touches everything, so you travel, look at how people actually live, and teach from that.","theme":"This is a time for seeing clearly rather than acting, and for being carefully seen.","advice":"Step back far enough to see the whole shape of your life. Remember that others read you, so let your example do the arguing.","moods":["waiting","retreat","discipline"],"keys":["view","example","distance"],"imagery":["wind crossing open ground","water poured before the offering","door cracked an inch open","watchtower over the fields","light of a whole country","hands washed and waiting"],"art":[1,1,1,1,0,1],"verbs":["watch","weigh","show","climb","wait"],"lines":["You look at this like a child from far off, which is fine for a bystander and not for you.","You peer through the crack in the door and see only your own narrow slice of it.","You look honestly at your own life and let what you see decide whether to advance or pull back.","You can see how the whole country is run, so go where the work is and offer what you know.","You measure your own life by the people it has shaped, and what you find is clean.","You look at your life from outside it, free of your own stake, and stand without fault."]},{"n":21,"name":"Shi He","en":"Biting Through","sym":"䷔","bits":"100101","tri":"Fire over Thunder","judgment":"Something is caught between the teeth and the jaw has to close. Success comes through penalties applied clearly and without appetite.","image":"Thunder and lightning arrive together, so you make the rules plain and the consequences known in advance.","theme":"An obstruction sits in the middle of your situation and it will not dissolve on its own.","advice":"Name the obstruction out loud and act on it decisively. Be exact about the consequence and take no pleasure in delivering it.","moods":["blocked","release","discipline"],"keys":["bite","obstacle","justice"],"imagery":["gristle between the teeth","lightning over the field","feet locked in the stocks","bronze arrow in the meat","yellow gold in the mouth","wood collar at the neck"],"art":[1,0,1,1,0,1],"verbs":["bite","break","judge","press","clear"],"lines":["Your feet are locked early and the small punishment stops you before real damage, so no blame.","You bite through soft meat and go so deep you lose your own face in it.","You chew on old cured meat and hit something rotten, which stings but is not your doing.","You bite dried meat off the bone and find a metal arrow, so stay alert and keep working.","You bite lean dried meat and find gold, and staying awake to the danger keeps you clean.","Your ears vanish inside the wooden collar, because you would not hear a single warning."]},{"n":22,"name":"Bi","en":"Grace","sym":"䷕","bits":"101001","tri":"Mountain over Fire","judgment":"Grace succeeds in small matters. Form can carry a thing beautifully but it cannot decide what is true.","image":"Fire at the foot of the mountain lights the near ground, so you handle the day's small affairs and leave the great verdicts alone.","theme":"The surface of your situation matters right now, and only the surface.","advice":"Make the form beautiful and keep it honest about its size. Do not settle a large question with a good presentation.","moods":["joy","discipline"],"keys":["form","beauty","modesty"],"imagery":["fire below the mountain","carriage left at the gate","white horse coming fast","small roll of plain silk","beard combed for morning","hillside garden in bloom"],"art":[1,1,1,1,1,1],"verbs":["adorn","simplify","shine","walk","refine"],"lines":["You give up the ride you did not earn and go on foot, and your feet are enough.","You groom the beard and not the chin, so know you are decorating a decision that is not yours.","You are polished and sleek and comfortable, which holds only if you stay steady underneath it.","You hesitate between ornament and plainness, then a white horse arrives and it is not a robber.","You bring a thin roll of silk to the hill garden and feel poor, but the honesty lands well.","You strip the ornament off entirely and what is left is enough, with nothing to answer for."]},{"n":23,"name":"Bo","en":"Splitting Apart","sym":"䷖","bits":"000001","tri":"Mountain over Earth","judgment":"Everything is being stripped away from underneath. There is nowhere useful to go right now.","image":"The mountain wears down onto the earth beneath it, so those on top keep their place only by giving to those below.","theme":"The support under you is being eaten away and force will not stop it.","advice":"Stop building and protect the base. Feed the people who hold you up and let the season finish.","moods":["loss","danger","retreat"],"keys":["decay","erosion","patience"],"imagery":["bed legs split off","mountain sliding onto flat ground","last fruit on the branch","roof gone to the rain","shoal of fish turning","house coming apart quietly"],"art":[1,1,0,1,1,1],"verbs":["strip","endure","yield","shelter","wait"],"lines":["The legs of the bed are already splitting, and pushing on regardless only speeds the ruin.","The frame goes next, and you have lost the people who would have steadied you.","You break with the ones doing the damage even though they are yours, and that is right.","The bed splits up to the skin and the harm has reached your body, with nothing to soften it.","You line people up like fish and lead them gracefully into favor, and everything moves again.","One large fruit hangs uneaten, and its seed carries you while the grasping lose their house."]},{"n":24,"name":"Fu","en":"Return","sym":"䷗","bits":"100000","tri":"Earth over Thunder","judgment":"The light comes back. Going out and coming in does no harm, friends arrive, and on the seventh day the turn completes.","image":"Thunder rests inside the earth at the solstice, so the roads close and nobody travels while the new thing takes hold.","theme":"You are standing at the exact turning point where something lost begins coming back.","advice":"Turn around before you have gone far. Protect the small new energy quietly instead of testing how much it can take.","moods":["turning","rising","release"],"keys":["return","renewal","seed"],"imagery":["thunder buried in winter earth","one light under the snow","gate shut at solstice","footprints turning back early","seventh day coming around","first green at frost line"],"art":[1,0,1,1,1,1],"verbs":["return","begin","rest","guard","turn"],"lines":["You catch yourself a few steps down the wrong road and turn back, and nothing is lost.","You come back calmly and without drama, because someone above you made returning easy.","You keep leaving and coming back again and again, which is risky and still not wrong.","You are walking in the middle of the crowd and you turn back alone, and that is yours.","You return generously, owning what you did without excuses, and there is nothing left to regret.","You miss the turn completely, and marching on from here costs you ten years of ground."]},{"n":25,"name":"Wu Wang","en":"Innocence","sym":"䷘","bits":"100111","tri":"Heaven over Thunder","judgment":"Innocence brings great success when the motive is unmixed. Act from anything crooked and nothing you start will hold.","image":"Thunder rolls under the open sky and everything answers in its own way, so you nourish what grows and follow the season.","theme":"Your situation asks for a clean motive rather than a clever plan.","advice":"Do the next honest thing without watching for the payoff. If you cannot act without calculating, do not act yet.","moods":["release","discipline","rising"],"keys":["innocence","instinct","honesty"],"imagery":["thunder under an open sky","field plowed without counting","cow untied by the roadside","grass moving before rain","medicine left in the jar","hands doing the plain work"],"art":[0,1,1,1,1,1],"verbs":["trust","plow","act","wait","heal"],"lines":["You move on a clean impulse before you can talk yourself out of it, and it goes well.","You plow without counting the harvest, and wanting nothing from it is what makes it worth starting.","Someone unties a cow and the blame lands on you, undeserved and yours to carry anyway.","You keep to what is actually yours and change nothing to please anyone, and stay clean.","You fall ill through no fault of your own, so take no medicine and let it pass.","You act now on pure impulse and it goes badly, because the moment itself is wrong."]},{"n":26,"name":"Da Xu","en":"The Taming Power of the Great","sym":"䷙","bits":"111001","tri":"Mountain over Heaven","judgment":"Great restraint holds great force. Steadiness pays, eating away from home pays, and the hard crossing is worth making.","image":"The whole sky is held inside the mountain, so you fill yourself with old words and old deeds until your character can carry the load.","theme":"Your power is real and this season is storing it rather than spending it.","advice":"Take the pressure as training instead of punishment. Build reserves and study the ground before you release any of it.","moods":["blocked","discipline","abundance"],"keys":["restraint","storage","strength"],"imagery":["heaven held in the mountain","axle pulled from the cart","board on the bull's horns","boar's tusk gone harmless","good horse behind another","granary filling in silence"],"art":[1,1,1,1,1,1],"verbs":["hold","store","train","curb","study"],"lines":["Danger sits right in front of you, so stop where you are and do not push.","The axle is out of your wagon and you go nowhere, which spares you the wreck.","You run with good horses now, so drill every day, stay awake to danger, and go.","You board the young bull's horns before they grow, and stopping trouble that early is great fortune.","You take the boar's power at the root instead of fighting the tusk, and the danger simply ends.","The gate of heaven opens and everything you stored moves at once, meeting no resistance anywhere."]},{"n":27,"name":"Yi","en":"Nourishment","sym":"䷚","bits":"100001","tri":"Mountain over Thunder","judgment":"Steadiness brings good fortune. Watch how you feed the people around you and watch closely what you put in your own mouth.","image":"Thunder wakes at the foot of the mountain, so you are careful with your words and moderate with food and drink.","theme":"What you take in and what you hand out is the entire question right now.","advice":"Audit your intake, in food, in talk, in company. Drink from your own source before you go asking anyone else.","moods":["discipline","waiting","abundance"],"keys":["nourish","intake","restraint"],"imagery":["open mouth of the mountain","magic tortoise let go","bowl passed the wrong way","tiger watching the table","spring under the hillside","teeth waiting in the dark"],"art":[1,1,1,1,1,1],"verbs":["feed","chew","speak","withhold","source"],"lines":["You let go of your own magic and sit watching someone else eat, mouth hanging open.","You beg upward and sideways for feeding you already carry, and the habit ends badly.","You turn away from real nourishment for something that thrills you, and ten years go nowhere.","You look up to be fed and it works, so hunt with a tiger's focus and no shame.","You cannot feed yourself yet, so stay where you are, lean on the wise, and skip the crossing.","You become the source others feed from, so carry that danger carefully and you can go anywhere."]},{"n":28,"name":"Da Guo","en":"Preponderance of the Great","sym":"䷛","bits":"011110","tri":"Lake over Wind","judgment":"The ridgepole is bending toward the breaking point. Have somewhere to go and it still comes out right.","image":"The lake has risen over the tops of the trees, so you stand alone unbothered and walk away from the world undaunted.","theme":"The load has outgrown the structure and something extraordinary is being asked of you.","advice":"Brace the beam or lighten it now, before it splits. Extraordinary times permit unusual solutions, not reckless ones.","moods":["danger","turning","loss"],"keys":["excess","strain","crisis"],"imagery":["ridgepole bent at the middle","lake over the treetops","white rushes laid down","dry poplar putting out roots","old willow in flower","water closing overhead"],"art":[1,1,1,0,1,1],"verbs":["bear","brace","cross","risk","release"],"lines":["You lay soft rushes under what you set down, and that care costs nothing and saves everything.","The dry poplar puts out new roots, and an unlikely pairing gives you your life back.","You keep loading the beam that is already bending, and it snaps under your weight.","The ridgepole is braced and holding, so keep your motives clean or the rescue humiliates you.","The withered tree flowers late and briefly, which harms nothing and is not worth praising.","You wade in and the water closes over your head, and you go under for something worth it."]},{"n":29,"name":"Kan","en":"The Abysmal","sym":"䷜","bits":"010010","tri":"Water over Water","judgment":"Danger arrives again and again. Keep one true thing intact inside you and your movement through it succeeds.","image":"Water keeps flowing and still arrives, so you stay the same person in the dark and go on teaching what you know.","theme":"You are inside a repeating danger and the way out of it is through.","advice":"Stop fighting the current and learn its shape instead. Hold to what is honest in you and let that carry you down.","moods":["danger","waiting","blocked"],"keys":["depth","hazard","sincerity"],"imagery":["water in the ravine","rope worn thin on stone","wine jug through the window","pit inside the pit","thorn hedge around the wall","river finding the low way"],"art":[0,1,1,1,1,1],"verbs":["flow","sink","hold","learn","pass"],"lines":["You have fallen into the pit inside the pit, and danger has become a habit.","The drop is real, so give up the rescue and take only the small things within reach.","Danger ahead and danger behind, so stop moving entirely and do not thrash yourself deeper.","A jug of wine and a bowl of rice passed through the window, plain and honest and enough.","The water fills only to the rim and no higher, so the flood ends and you come out clean.","You are tied and hedged in and lost for three years, because you kept choosing the dark."]},{"n":30,"name":"Li","en":"The Clinging","sym":"䷝","bits":"101101","tri":"Fire over Fire","judgment":"Fire depends on what it burns. Stay attached to what holds you and the light succeeds, and tending the slow animal brings fortune.","image":"Light rises twice over, so you keep the brightness going until it reaches all four directions.","theme":"Your brilliance is real, but it belongs to something and it goes out alone.","advice":"Attach yourself on purpose to a person, a craft, or a duty that can hold your fire. Tend it daily like livestock, not like a mood.","moods":["rising","joy","discipline"],"keys":["clarity","attachment","fire"],"imagery":["two fires stacked high","footprints crossing at the door","yellow light at noon","clay pot beaten at sundown","sun going down red","cow led out at dawn"],"art":[0,1,0,1,1,1],"verbs":["burn","cling","shine","tend","see"],"lines":["The morning tracks run every direction at once, so slow down and be serious about which you take.","You burn at the steady middle heat, yellow and unspectacular, and this is the best light there is.","The sun is going down and you either beat the pot and sing or wail about getting old.","You flare up out of nowhere, scorch everything near you, and are thrown out as fast as you came.","You weep until you are empty and the grief burns itself clean, and after that it goes well.","You are sent to put it down, so break the ringleaders and let the followers walk away."]},{"n":31,"name":"Xian","en":"Influence","sym":"䷞","bits":"001110","tri":"Lake over Mountain","judgment":"Attraction succeeds when it stays steady. Coming toward another with an open, uncrowded heart brings good fortune.","image":"A lake rests in the hollow of a mountain, so you stay low and open and people come to you on their own.","theme":"Something is pulling you and you are pulling something, and the pull runs below thought.","advice":"Stay receptive instead of chasing. Let the attraction show you what it wants before you move your whole body after it.","moods":["union","rising","joy"],"keys":["attraction","openness","feeling"],"imagery":["lake held in the mountain","big toe already turning","calves before the legs move","hollow made to be filled","back of the neck still","tongue moving too fast"],"art":[1,1,0,1,1,1],"verbs":["draw","open","feel","wait","touch"],"lines":["You feel it first in your big toe, a stirring nobody else can see yet.","The pull reaches your calves and you want to run, so stay where you are and it goes well.","It reaches your thighs and you follow whatever moves, and chasing like that ends in embarrassment.","Keep your heart steady and the regret lifts, since only what you truly mean draws anyone to you.","The feeling settles in the back of your neck, too high to move you and too honest to regret.","It reaches your jaw and tongue and turns into talk, which convinces nobody for long."]},{"n":32,"name":"Heng","en":"Duration","sym":"䷟","bits":"011100","tri":"Thunder over Wind","judgment":"Duration succeeds and carries no fault. Stay with it, keep a direction, and keep moving inside the form you have chosen.","image":"Thunder and wind renew each other endlessly, so you stand firm and stop changing your direction.","theme":"This is about what lasts, and lasting is a practice rather than a feeling.","advice":"Hold the shape and let the content move inside it. Do not confuse restlessness with progress or rigidity with constancy.","moods":["discipline","union","waiting"],"keys":["endurance","constancy","form"],"imagery":["thunder and wind paired","riverbed holding the river","same road walked daily","empty field after the hunt","hinge worn smooth by use","roots under a standing tree"],"art":[0,1,1,1,1,0],"verbs":["endure","hold","repeat","steady","stay"],"lines":["You demand permanence on the first day, and digging that deep this early ruins the ground.","You hold your place inside your actual strength, and the regret you were carrying dissolves.","You give your character no staying power at all, and the shame of that keeps coming back.","You keep hunting the same empty field, because persistence in the wrong place catches nothing.","You hold one fixed rule for life, which steadies one kind of person and traps another.","You have made restlessness your permanent condition, and nothing built on that ever holds."]},{"n":33,"name":"Dun","en":"Retreat","sym":"䷠","bits":"001111","tri":"Heaven over Mountain","judgment":"Retreat succeeds. What is small and dark is growing, so yielding ground now is strength, not defeat. Hold steadily to the little you keep.","image":"The mountain rises but the sky pulls back above it, so you keep the wrong people at a distance without anger, only reserve.","theme":"The situation is turning against you and the honest move is to step back before you are forced back.","advice":"Withdraw early and cleanly, while leaving is still your own decision. Keep your distance politely rather than fighting a battle whose timing belongs to someone else.","moods":["retreat","waiting"],"keys":["distance","timing","reserve"],"imagery":["mountain under a wide sky","yellow oxhide strap","tail caught in the gate","dust on an empty road","door closed without a word","cool space between two chairs"],"art":[1,1,1,0,1,1],"verbs":["withdraw","retreat","yield","wait","guard"],"lines":["You are last out and caught at the rear, so stay still and start nothing.","Your grip is yellow leather on the wrist, and no one talks you out of it.","Ties and obligations halt your retreat, so keep those people close and give them small work.","You walk away from what you still love, and the walking itself is what saves you.","You leave on good terms, at the right hour, with nothing unsaid and no doors slammed.","You go free and light, owing nobody, and the road opens because nothing behind you pulls."]},{"n":34,"name":"Da Zhuang","en":"The Power of the Great","sym":"䷡","bits":"111100","tri":"Thunder over Heaven","judgment":"Great power is here, and it only works joined to what is right. Strength without a straight line behind it turns into damage.","image":"Thunder rolls high in the open sky, so you refuse to walk any road that does not match what you believe.","theme":"You have real force available right now, and the whole question is whether you can aim it.","advice":"Do not spend your strength proving you have it. Move only where the path is clearly right, and let restraint be the thing that makes you formidable.","moods":["rising","discipline"],"keys":["strength","restraint","momentum"],"imagery":["thunder rolling through open sky","goat horns in the hedge","axle of a heavy cart","strength down in the toes","ram against a plank fence","wheel that holds the load"],"art":[1,0,1,1,1,1],"verbs":["push","charge","hold","steady","break"],"lines":["Strength lives only in your toes right now, so pushing forward from there ends badly.","You are strong and moderate at the same time, and holding that line quietly is enough.","Only the reckless use force here, and if you charge the hedge your horns stay stuck.","The fence gives way, the tangle clears, and your power rides steady like a heavy axle.","You drop your stubbornness as easily as losing a goat, and nothing of value goes with it.","You are wedged in the fence, unable to go on or back, so see it clearly and stop."]},{"n":35,"name":"Jin","en":"Progress","sym":"䷢","bits":"000101","tri":"Fire over Earth","judgment":"Progress like the sun clearing the horizon. You are given more than you asked for and called on more than once in a day.","image":"The sun rises over open ground, so you keep polishing the brightness you already carry instead of borrowing someone else's.","theme":"You are being seen and lifted, and the light on you shows everything, the good work and the grasping alike.","advice":"Move forward openly and let your work be visible. Keep clarifying your own character, because at this altitude nothing you do stays private.","moods":["rising","abundance"],"keys":["recognition","clarity","ascent"],"imagery":["sun clearing the horizon","horses given three times over","light spreading across flat ground","hamster hoarding in daylight","horns at your own gate","shadow shrinking toward noon"],"art":[1,0,1,1,0,1],"verbs":["rise","shine","advance","clarify","offer"],"lines":["You advance and get turned back, so stay calm, stay steady, and take the doubt lightly.","You move forward in sorrow, but hold true and help arrives through an older woman's blessing.","Everyone around you agrees, and their trust carries you further than your own effort could.","You grab and hoard in broad daylight like a hamster, and the daylight is what exposes you.","Stop counting gain and loss, act anyway, and things go further than you would dare plan.","Use force only to correct your own house, know the danger, and put the horns away after."]},{"n":36,"name":"Ming Yi","en":"Darkening of the Light","sym":"䷣","bits":"101000","tri":"Earth over Fire","judgment":"The light has gone under. In a hostile time you survive by holding your inner clarity and showing very little of it.","image":"The sun has sunk into the earth, so you live among everyone else, veil your brightness, and still burn.","theme":"You are in a situation where being right is not safe and being seen clearly costs you.","advice":"Keep your convictions and hide their edges. Do not argue with the darkness or try to correct it all at once, just outlast it with your inner light intact.","moods":["danger","blocked","waiting"],"keys":["concealment","endurance","light"],"imagery":["bird flying with lowered wings","light buried under the field","lamp turned to the wall","three days without bread","wound in the left thigh","smoke where a fire was"],"art":[1,1,1,0,1,0],"verbs":["endure","hide","dim","carry","survive"],"lines":["You fly with your wings lowered and go three days hungry rather than bend, so people talk.","You are wounded in the left thigh, and still you help others with the strength of a horse.","You catch the head of the darkness by luck, but do not try to fix everything now.","You see into the heart of it from inside, then walk out through the courtyard gate.","You keep your light behind a dull face, staying close to danger without handing anything over.","The one who dimmed everything climbs to the sky, then drops all the way into the ground."]},{"n":37,"name":"Jia Ren","en":"The Family","sym":"䷤","bits":"101011","tri":"Wind over Fire","judgment":"The family holds when each person keeps their own place. What steadies the whole house is patient attention from inside it.","image":"Wind rises off the fire, so your words carry weight because your life behind them does not change shape.","theme":"Your situation is about the small closed circle you belong to and whether its structure is honest.","advice":"Set clear limits early and then live inside them yourself. Influence here comes from consistency at home, not from persuasion or force.","moods":["union","discipline"],"keys":["home","roles","consistency"],"imagery":["wind rising off a fire","bread cooling on the table","gate latched at dusk","same chair every evening","voices raised then softened","hearth kept for years"],"art":[0,1,1,1,1,1],"verbs":["tend","feed","hold","keep","order"],"lines":["You set the rules of the house early, before habits harden, and later regret never arrives.","You stay in the center and feed people instead of chasing whims, and the house holds.","Too much strictness costs you, but laughing away every limit costs far more in the end.","You are the wealth of this house, and the quiet order you keep is the actual fortune.","You come to your own people as love and not fear, so nobody has to defend themselves.","Your work speaks for you, steady across years, and respect arrives without you ever asking."]},{"n":38,"name":"Kui","en":"Opposition","sym":"䷥","bits":"110101","tri":"Fire over Lake","judgment":"Things have pulled apart. Nothing large can be forced together now, but in small matters and small kindnesses there is real luck.","image":"Fire climbs and the lake sinks, so inside every fellowship you keep the part of yourself that belongs to no one.","theme":"You and someone you need are misreading each other, and the distance feels bigger than it actually is.","advice":"Work the small scale. Do not chase what has drifted off, and check whether the enemy you see is really just a friend covered in mud.","moods":["blocked","turning"],"keys":["difference","misreading","reunion"],"imagery":["fire above still water","horse that comes back alone","wagon stuck with oxen halted","handshake in a narrow street","mud on a familiar face","rain after the lowered bow"],"art":[0,1,1,1,0,0],"verbs":["differ","meet","hold","distinguish","reconcile"],"lines":["Let the horse go and it comes back on its own, and stay careful around bad company.","You meet the person you need by chance in a narrow street, and the informality is fine.","Your wagon is dragged back and you are hurt and shamed, and even so this ends well.","Alone among strangers you find one honest person, and good faith between you carries the danger.","Someone bites through the wrapping to reach you, so go to them and nothing is lost.","You see a friend as filth and devils, raise the bow, lower it, and rain ends the quarrel."]},{"n":39,"name":"Jian","en":"Obstruction","sym":"䷦","bits":"001010","tri":"Water over Mountain","judgment":"An obstacle stands in front of you. Go where the ground is soft rather than where it is steep, and find someone whose judgment you trust.","image":"Water sits on the mountain and cannot run off, so you turn back toward yourself and work on your own character.","theme":"Forward is blocked, and the block is not a punishment but a signal about direction.","advice":"Stop pushing at the hard face. Come back, look honestly at your own part in this, and gather the people who can climb it with you.","moods":["blocked","danger","waiting"],"keys":["obstacle","turning","allies"],"imagery":["water on a steep mountain","path washed out by rain","gorge with no bridge","turning back at the ridge","friends arriving through deep snow","loose stones under your boots"],"art":[0,1,1,1,1,0],"verbs":["pause","turn","reflect","gather","wait"],"lines":["Going ahead now hits the wall, and turning back earns you praise instead of bruises.","Obstacle after obstacle finds you and none of it is your fault, but duty keeps you moving.","You set out, meet the drop, and come back to the people who depend on you.","Going alone fails here, so come back and join the ones who can carry this with you.","In the deepest part of the blockage friends arrive, and the work becomes possible again.","Turning back now brings the most, especially toward the person whose judgment you actually trust."]},{"n":40,"name":"Xie","en":"Deliverance","sym":"䷧","bits":"010100","tri":"Thunder over Water","judgment":"The knot loosens. If there is nothing left to settle, come home and rest. If something still waits, do it now and do it quickly.","image":"Thunder and rain break at once and clear the air, so you pardon what was done to you and let old debts go.","theme":"The pressure that has been sitting on you is lifting, and how you handle the first free breath matters.","advice":"Do not squeeze the moment for revenge or advantage. Clear the last obstruction cleanly, forgive the rest, and then genuinely rest.","moods":["release","turning"],"keys":["relief","forgiveness","timing"],"imagery":["thunder and rain breaking together","ice loosening in the river","hawk off a high wall","yellow arrow in the hand","load dropped in the road","air after a storm passes"],"art":[0,1,1,1,1,0],"verbs":["release","forgive","clear","loosen","return"],"lines":["The tension breaks and there is nothing to do, so rest and let quiet finish the work.","You clear the three flatterers out of the field and hold to the straight middle way.","Carrying a load while riding rich invites robbers, and the shame of that belongs to you.","Free your foot from the one who clings, and the friend you can trust arrives after.","Free yourself first and honestly, and the people around you straighten or fall away by themselves.","You take clean aim at the hawk on the high wall, and one shot ends the whole thing."]},{"n":41,"name":"Sun","en":"Decrease","sym":"䷨","bits":"110001","tri":"Mountain over Lake","judgment":"Decrease done with sincerity brings luck. When means are thin, two plain bowls offered honestly count as much as a feast.","image":"The lake wears away at the foot of the mountain, so you hold down your anger and check your appetites.","theme":"Something is being taken away from you, and the loss is doing work you cannot see yet.","advice":"Give up what is extra rather than what is essential, and let the offering be simple and true. Cut your own faults first, before you cut anyone else's.","moods":["loss","discipline"],"keys":["sacrifice","simplicity","sincerity"],"imagery":["lake wearing down the mountain","two small bowls offered","three walking, then two","ten pairs of tortoise shells","anger swallowed at the door","less on the plate nightly"],"art":[1,0,0,0,1,1],"verbs":["simplify","give","reduce","restrain","offer"],"lines":["Your part is finished, so leave quickly, but weigh how much your leaving costs the others.","Hold your ground and give from strength, because emptying yourself out helps nobody for long.","Three together lose one and one alone finds a companion, because real work pairs off.","Cut down your own faults fast, and the people you were losing come back glad.","Help arrives that nothing can argue with, and all you have to do is accept it.","You gain without taking from anyone, and what you build stops belonging only to you."]},{"n":42,"name":"Yi","en":"Increase","sym":"䷩","bits":"100011","tri":"Wind over Thunder","judgment":"Increase. This is the time to begin the large thing and to take the risky passage, because the current is under you.","image":"Wind and thunder strengthen each other, so when you see something good you copy it, and when you find a fault you drop it.","theme":"Energy is flowing toward you from above, and it stays only as long as you keep passing it down.","advice":"Act now and act big, and give away as much as you receive. What comes to you is not a reward, it is fuel meant to move through you.","moods":["rising","abundance","joy"],"keys":["generosity","growth","momentum"],"imagery":["wind and thunder together","tortoise shells at the door","rain arriving over dry fields","seed pressed into open ground","hands open at the gate","gift passed down the row"],"art":[0,0,1,1,1,1],"verbs":["give","grow","spread","improve","share"],"lines":["Real support is behind you, so take on the large thing instead of the safe small one.","A gift comes that nothing can block, so stay steady and keep your side of it honest.","Even hard events enrich you now if you stay sincere, keep to the middle, and report plainly.","You stand between two sides and carry the message, and because you are fair they follow.","Your kindness is real, so stop asking whether it shows, because people already know what you are.","You take and return nothing, your heart never settles, and blows start coming from every direction."]},{"n":43,"name":"Guai","en":"Break-through","sym":"䷪","bits":"111110","tri":"Lake over Heaven","judgment":"The thing must be named out loud, truthfully, in the open. There is danger in it. Do not reach for weapons, and warn your own people first.","image":"The lake has risen against the sky and must break, so you share what you have downward and never rest on being right.","theme":"One last corrupt or exhausted thing is holding on, and it will not go quietly or by itself.","advice":"Say the true thing publicly and without heat. Deal with the root rather than the argument, and start by cleaning up your own side of it.","moods":["turning","danger","release"],"keys":["resolve","truth","breakthrough"],"imagery":["lake risen against the sky","weeds pulled at the root","walking alone in the rain","alarm called at midnight","mud on a clean coat","dam about to give"],"art":[1,1,1,1,0,1],"verbs":["resolve","name","cut","announce","clear"],"lines":["Your toes are strong and eager, but going out unready for this fight is a mistake.","You call the alarm at night and stay armed until morning, and there is nothing to fear.","Wearing your resolve on your face costs you, so walk alone in the rain and let them mutter.","You are raw and stubborn and refuse to be led, so the advice you need goes unheard.","Pull the weed at the root without making a speech, and keep walking down the middle.","You decide the last of it is gone and stop watching, and that is exactly where it returns."]},{"n":44,"name":"Gou","en":"Coming to Meet","sym":"䷫","bits":"011111","tri":"Heaven over Wind","judgment":"Something meets you that looks small, harmless, and attractive. It is not. Do not bind yourself to it.","image":"Wind moves everywhere under the sky, so you send your word out to every corner before the thing spreads.","theme":"A small compromise, temptation, or influence has just entered, and it is stronger than its size suggests.","advice":"Check it now, at the beginning, while checking is still easy. Stay open enough to meet what comes and clear-eyed enough not to take it home.","moods":["danger","turning"],"keys":["temptation","encounter","restraint"],"imagery":["wind under a wide sky","bronze brake on a wheel","fish kept in the tank","melon under willow leaves","lean pig testing the fence","small crack in the foundation"],"art":[0,1,1,1,1,1],"verbs":["meet","check","contain","notice","refuse"],"lines":["Put a bronze brake on it now, because what looks lean will rage once it grows.","Keep the fish quietly in your own tank, and do not let it reach the other people.","You are sore and hesitant and cannot move easily, but seeing the danger keeps it small.","Your tank is empty because you held everyone at arm's length, and now they are simply gone.","Cover the ripening melon with leaves, hide your intent, and what you want falls into your hands.","You meet it with your horns and get laughed at, and the distance you kept was still right."]},{"n":45,"name":"Cui","en":"Gathering Together","sym":"䷬","bits":"000110","tri":"Lake over Earth","judgment":"People come together around something worth gathering for. Bring a real offering, find the person who can hold the center, and commit.","image":"The lake rises over the earth and could flood it, so you keep your defenses repaired against what nobody expects.","theme":"You are being pulled into a group, and the question is what actually holds it together.","advice":"Join, and join for a reason larger than yourself. Where the crowd gathers, prepare for the trouble that crowds attract.","moods":["union","abundance"],"keys":["assembly","center","offering"],"imagery":["lake gathering over low ground","crowd filling a courtyard","offering laid on the table","clasped hands in a crowd","weapons oiled before the season","tears at the crowd's edge"],"art":[1,1,1,0,1,0],"verbs":["gather","join","call","offer","prepare"],"lines":["Your sincerity wavers and the group blurs, so call out once, take a hand, and laugh again.","Let yourself be drawn in rather than pushing your way in, and a small honest offering suffices.","You stand outside the circle sighing, so go anyway and accept the small shame of asking.","You gather people around something bigger than yourself, and that is the only reason it works.","You hold the position but not everyone's heart, so keep at it, long and steady and plain.","You are left grieving at the edge of the crowd, and that grief is how you get in."]},{"n":46,"name":"Sheng","en":"Pushing Upward","sym":"䷭","bits":"011000","tri":"Eart
