<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xtract settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#ffffff; --surface:#f7f7f6; --hair:#e6e6e4;
      --ink:#111111; --ink-2:#3d3d3d; --muted:#6e6e6e; --faint:#a6a6a6; --on-ink:#ffffff;
      --font:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Noto Sans SC",sans-serif;
      --r-pill:10px; --text-col:620px; --gutter:clamp(16px,5vw,64px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#0f0f0f; --surface:#171717; --hair:#2a2a2a;
        --ink:#f2f2f2; --ink-2:#d0d0d0; --muted:#9a9a9a; --faint:#646464; --on-ink:#0f0f0f;
      }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--muted); font-family:var(--font);
           font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased; }
    main { max-width:calc(var(--text-col) + 2 * var(--gutter)); padding:128px var(--gutter) 96px; margin:0 auto; }
    .eyebrow { margin:0; font-size:11px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
    h1 { margin:18px 0 0; font-size:clamp(22px,2.4vw,30px); font-weight:500; letter-spacing:-0.01em; color:var(--ink); line-height:1.3; }
    .lede { margin:14px 0 0; }
    .field { margin-top:64px; }
    .field + .field { margin-top:48px; }
    label { display:flex; gap:12px; align-items:baseline; }
    .num { font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; }
    input { display:block; width:100%; margin-top:10px; padding:8px 0; border:0; border-bottom:1px solid var(--hair);
            border-radius:0; background:transparent; color:var(--ink); font:inherit; outline:none; }
    input::placeholder { color:var(--faint); }
    input:focus { border-bottom-color:var(--ink); }
    small { display:block; margin-top:10px; font-size:12px; color:var(--faint); line-height:1.6; }
    a { color:var(--ink-2); text-decoration:none; }
    a:hover { color:var(--ink); }
    .actions { margin-top:64px; display:flex; align-items:center; gap:20px; }
    button { background:var(--ink); color:var(--on-ink); border:0; border-radius:var(--r-pill); padding:10px 18px;
             font:inherit; font-size:13px; font-weight:500; cursor:pointer; transition:transform .25s ease-out; }
    button:hover { transform:translateY(-1px); }
    #msg { font-size:12px; color:var(--faint); }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Xtract</p>
    <h1>Settings</h1>
    <p class="lede">Summaries are written by Claude with your own Anthropic key — it stays in this browser and nowhere else.</p>

    <div class="field">
      <label for="apiKey"><span class="num">01</span><span class="eyebrow">Anthropic API key</span></label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-…">
      <small>Create one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com →</a></small>
    </div>

    <div class="field">
      <label for="model"><span class="num">02</span><span class="eyebrow">Model</span></label>
      <input id="model" type="text" placeholder="claude-sonnet-4-5">
      <small>Leave blank for the default. Any Claude model id works — a Haiku model is cheaper for large ranges.</small>
    </div>

    <div class="actions">
      <button id="save">Save</button><span id="msg"></span>
    </div>
  </main>
  <script src="options.js"></script>
</body>
</html>
